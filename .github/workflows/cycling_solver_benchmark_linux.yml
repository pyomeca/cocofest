name: Cycling fatigue solvers — assisted benchmark

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: GitHub-hosted image or label of a larger Linux runner
        required: true
        default: ubuntu-22.04
        type: string
      cycles:
        description: Maximum one-cycle RHO windows, or "screen" for the option matrix
        required: true
        default: "30"
        type: string
      crank_assistance_nm:
        description: Driving crank assistance magnitude in N.m
        required: true
        default: "0.20"
        type: string
      terminal_wheel_q_slack:
        description: Local cycle-boundary crank-angle slack in radians
        required: true
        default: "0.002"
        type: string
      solver_max_iterations:
        description: Maximum NLP iterations for each RHO
        required: true
        default: "2000"
        type: string
      seed_validation_max_iterations:
        description: Maximum IPOPT iterations used to validate the shared continuation seed
        required: true
        default: "2000"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: cycling-fatigue-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CASADI_VERSION: "3.7.2"
  CASADI_COMMIT: f959d3175a444d763e4eda4aece48f4c5f4a6f90
  # CasADi 3.7.2's sparse Alpaqa interface targets this compatibility fork.
  ALPAQA_COMMIT: bf9f87d59640501ea72f94aa6e2d4e62b20c677b
  BIOPTIM_REPOSITORY: mickaelbegon/BiorbdOptim
  BIOPTIM_MADNLP_COMMIT: 346eb1d445e6ba67010b96c6f16ba830185119e7
  BIOPTIM_ALPAQA_COMMIT: d84e7e43534360fc048e0be26a3bd69a2abc2d77
  MADNLP_ARCHIVE: madnlp-jl1.10.4-ubuntu-20.04-x64.zip
  MADNLP_SHA256: 333c42a1beb04fdba84410cc861927a74c3591c3b9cffd15323cbfeb44fbc8a0
  MADNLP_URL: https://github.com/tmmsartor/madnlp_c/releases/download/nightly-cpu_only/madnlp-jl1.10.4-ubuntu-20.04-x64.zip
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  JULIA_NUM_THREADS: "1"
  MPLBACKEND: Agg
  MPLCONFIGDIR: /tmp/cocofest-matplotlib

jobs:
  prepare-seed:
    name: Validate the common continuation seed
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Cocofest
        uses: actions/checkout@v6

      - name: Checkout the pinned Bioptim integration
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BIOPTIM_REPOSITORY }}
          ref: ${{ env.BIOPTIM_MADNLP_COMMIT }}
          path: .benchmark-deps/bioptim

      - name: Set up the Linux benchmark environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: cocofest-cycling-benchmark
          environment-file: .github/cycling-benchmark-linux-environment.yml
          conda-remove-defaults: true

      - name: Detect the CPU allocation
        run: |
          # GNU nproc honors OMP_NUM_THREADS. Ignore that solver safeguard
          # while detecting the CPU allocation used for builds and OCP threads.
          available_cores="$(env -u OMP_NUM_THREADS -u OMP_THREAD_LIMIT nproc)"
          echo "BENCHMARK_THREADS=$available_cores" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$available_cores" >> "$GITHUB_ENV"
          lscpu

      - name: Install the reference numerical stack
        run: |
          python -m pip install --no-deps "casadi==$CASADI_VERSION"
          bash .github/scripts/install_biorbd_casadi_linux.sh
          python -m pip install --no-deps -e .benchmark-deps/bioptim

      - name: Validate the seed on the assisted target
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p benchmark-seed-result
          python examples/fes_multibody/cycling/cycling_fes_solver_comparison.py \
            --solvers ipopt \
            --objective fatigue \
            --ipopt-profile periodic_collocation \
            --cycles-per-window 1 \
            --stimulations-per-cycle 30 \
            --n-windows 1 \
            --n-threads "$BENCHMARK_THREADS" \
            --crank-assistance "${{ inputs.crank_assistance_nm }}" \
            --standard-warmup-seed .github/benchmark-seeds/legacy-resistive-0p22-warmup.npz \
            --legacy-standard-warmup-seed-signed-torque 0.22 \
            --standard-warmup-seed-continuation \
            --warmup-ipopt-linear-solver mumps \
            --ipopt-linear-solver mumps \
            --ipopt-max-iter "${{ inputs.seed_validation_max_iterations }}" \
            --ipopt-disable-historical-initial-guess \
            --state-scaling full \
            --first-node-wheel-q-slack 0 \
            --terminal-wheel-q-slack "${{ inputs.terminal_wheel_q_slack }}" \
            --compact-rho-output \
            --print-traces \
            --output-json "$GITHUB_WORKSPACE/benchmark-seed-result/seed-check.json"
          jq -e '.results[0].success == true' \
            "$GITHUB_WORKSPACE/benchmark-seed-result/seed-check.json"
          cp .github/benchmark-seeds/legacy-resistive-0p22-warmup.npz \
            benchmark-seed-result/common-continuation-warmup.npz

      - name: Upload the validated immutable common seed
        uses: actions/upload-artifact@v7
        with:
          name: cycling-assisted-common-seed-${{ github.run_id }}
          path: benchmark-seed-result/common-continuation-warmup.npz
          if-no-files-found: error
          retention-days: 30

  screen-options:
    name: Option screen — ${{ matrix.solver }}
    if: inputs.cycles == 'screen'
    needs: prepare-seed
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - solver: madnlp
            bioptim_commit: 346eb1d445e6ba67010b96c6f16ba830185119e7
            integration_branch: codex/madnlp-integration-master
            casadi_cxx_abi: 0
          - solver: alpaqa
            bioptim_commit: d84e7e43534360fc048e0be26a3bd69a2abc2d77
            integration_branch: codex/alpaqa-integration
            casadi_cxx_abi: 1
    env:
      CASADI_CXX_ABI: ${{ matrix.casadi_cxx_abi }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Cocofest
        uses: actions/checkout@v6

      - name: Checkout the pinned Bioptim solver integration
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BIOPTIM_REPOSITORY }}
          ref: ${{ matrix.bioptim_commit }}
          path: .benchmark-deps/bioptim

      - name: Set up the Linux benchmark environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: cocofest-cycling-benchmark
          environment-file: .github/cycling-benchmark-linux-environment.yml
          conda-remove-defaults: true

      - name: Detect the CPU allocation
        run: |
          available_cores="$(env -u OMP_NUM_THREADS -u OMP_THREAD_LIMIT nproc)"
          if [[ "$available_cores" -lt 1 ]]; then
            echo "No CPU was reported by nproc." >&2
            exit 1
          fi
          echo "BENCHMARK_THREADS=$available_cores" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$available_cores" >> "$GITHUB_ENV"
          lscpu
          grep '^Cpus_allowed_list' /proc/self/status || true

      - name: Cache the MadNLP runtime
        if: matrix.solver == 'madnlp'
        id: screen-madnlp-cache
        uses: actions/cache@v6
        with:
          path: .cache/madnlp
          key: madnlp-cpu-jl1.10.4-linux-${{ env.MADNLP_SHA256 }}

      - name: Install the MadNLP runtime
        if: matrix.solver == 'madnlp' && steps.screen-madnlp-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/madnlp
          curl --fail --location --retry 3 "$MADNLP_URL" \
            --output "/tmp/$MADNLP_ARCHIVE"
          echo "$MADNLP_SHA256  /tmp/$MADNLP_ARCHIVE" | sha256sum --check
          unzip -q "/tmp/$MADNLP_ARCHIVE" -d .cache/madnlp

      - name: Configure the MadNLP runtime
        if: matrix.solver == 'madnlp'
        run: |
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/madnlp/foo/lib:${LD_LIBRARY_PATH:-}" \
            >> "$GITHUB_ENV"

      - name: Install CasADi with IPOPT and MadNLP
        if: matrix.solver == 'madnlp'
        run: python -m pip install --no-deps "casadi==$CASADI_VERSION"

      - name: Build CasADi with IPOPT and Alpaqa
        if: matrix.solver == 'alpaqa'
        run: bash .github/scripts/install_casadi_alpaqa_linux.sh

      - name: Install biorbd and Bioptim
        run: |
          bash .github/scripts/install_biorbd_casadi_linux.sh
          python -m pip install --no-deps -e .benchmark-deps/bioptim

      - name: Download the validated common continuation seed
        uses: actions/download-artifact@v8
        with:
          name: cycling-assisted-common-seed-${{ github.run_id }}
          path: benchmark-seed

      - name: Verify the option-screen environment
        env:
          PYTHONPATH: ${{ github.workspace }}
          BENCHMARK_SOLVER: ${{ matrix.solver }}
        run: |
          python - <<'PY'
          import os
          import casadi as cas
          import bioptim

          solver = os.environ["BENCHMARK_SOLVER"]
          print(f"CasADi {cas.__version__}")
          print(f"Bioptim {bioptim.__version__}")
          print(f"CasADi compiler flags: {cas.CasadiMeta.compiler_flags()}")
          assert "-DCASADI_WITH_THREAD" in cas.CasadiMeta.compiler_flags()
          assert cas.has_nlpsol("ipopt")
          assert cas.has_nlpsol(solver)
          assert hasattr(bioptim.Solver, solver.upper())
          PY
          python -m pytest -q \
            tests/shard1/test_solver_backends.py \
            tests/test_solver_option_screen_summary.py \
            tests/shard1/test_periodic_pulse_width.py::test_common_primal_threshold_is_independent_of_nlp_solver_tolerance \
            tests/shard1/test_periodic_pulse_width.py::test_github_benchmark_compares_physical_threshold_not_solver_tolerance

      - name: Run the focused ${{ matrix.solver }} option screen
        env:
          PYTHONPATH: ${{ github.workspace }}
          BENCHMARK_ASSISTANCE: ${{ inputs.crank_assistance_nm }}
          BENCHMARK_Q_SLACK: ${{ inputs.terminal_wheel_q_slack }}
          BENCHMARK_SOLVER: ${{ matrix.solver }}
          COCOFEST_BENCHMARK_COMMIT: ${{ github.sha }}
          BIOPTIM_BENCHMARK_COMMIT: ${{ matrix.bioptim_commit }}
          BIOPTIM_INTEGRATION_BRANCH: ${{ matrix.integration_branch }}
        run: |
          mkdir -p benchmark-option-screen

          run_case() {
            local variant="$1"
            local windows="$2"
            local tolerance="$3"
            shift 3
            echo "::group::${variant}"
            set -o pipefail
            python examples/fes_multibody/cycling/cycling_fes_solver_comparison.py \
              --solvers "$BENCHMARK_SOLVER" \
              --objective fatigue \
              --ipopt-profile periodic_collocation \
              --cycles-per-window 1 \
              --stimulations-per-cycle 30 \
              --n-windows "$windows" \
              --n-threads "$BENCHMARK_THREADS" \
              --crank-assistance "$BENCHMARK_ASSISTANCE" \
              --nlp-tolerance "$tolerance" \
              --primal-feasibility-threshold 1e-5 \
              --max-consecutive-failing 2 \
              --standard-warmup-seed benchmark-seed/common-continuation-warmup.npz \
              --legacy-standard-warmup-seed-signed-torque 0.22 \
              --standard-warmup-seed-continuation \
              --warmup-ipopt-linear-solver mumps \
              --ipopt-linear-solver mumps \
              --ipopt-disable-historical-initial-guess \
              --state-scaling full \
              --first-node-wheel-q-slack 0 \
              --terminal-wheel-q-slack "$BENCHMARK_Q_SLACK" \
              --compact-rho-output \
              --print-traces \
              --output-json "$GITHUB_WORKSPACE/benchmark-option-screen/${variant}.json" \
              "$@" \
              2>&1 | tee "benchmark-option-screen/${variant}.log"
            jq -e '.results[0] | (.attempted_windows > 0 and .error == null)' \
              "benchmark-option-screen/${variant}.json"
            echo "::endgroup::"
          }

          if [[ "$BENCHMARK_SOLVER" == "alpaqa" ]]; then
            alpaqa_common=(
              --alpaqa-max-iter 2000
              --alpaqa-alm-max-iter 100
              --alpaqa-max-wall-time 60
              --alpaqa-dual-warm-start-mode off
              --optional-nlp-periodic-ipopt-hot-start
            )
            run_case alpaqa-panoc60-default 1 1e-6 \
              "${alpaqa_common[@]}" --alpaqa-panoc-max-wall-time 60
            run_case alpaqa-panoc20-default 1 1e-6 \
              "${alpaqa_common[@]}" --alpaqa-panoc-max-wall-time 20
            run_case alpaqa-panoc5-default 1 1e-6 \
              "${alpaqa_common[@]}" --alpaqa-panoc-max-wall-time 5
            run_case alpaqa-panoc20-auto-penalty 1 1e-6 \
              "${alpaqa_common[@]}" --alpaqa-panoc-max-wall-time 20 \
              --alpaqa-initial-penalty 0
            run_case alpaqa-panoc20-penalty0p01 1 1e-6 \
              "${alpaqa_common[@]}" --alpaqa-panoc-max-wall-time 20 \
              --alpaqa-initial-penalty 0.01
            run_case alpaqa-panoc20-penalty0p01-factor2 1 1e-6 \
              "${alpaqa_common[@]}" --alpaqa-panoc-max-wall-time 20 \
              --alpaqa-initial-penalty 0.01 \
              --alpaqa-penalty-update-factor 2
          else
            madnlp_common=(
              --madnlp-max-iter 2000
              --madnlp-dual-warm-start-mode off
              --optional-nlp-periodic-ipopt-hot-start
            )
            run_case madnlp-tol1e-6-default 4 1e-6 "${madnlp_common[@]}"
            run_case madnlp-tol1e-7-default 4 1e-7 "${madnlp_common[@]}"
            run_case madnlp-tol1e-8-default 4 1e-8 "${madnlp_common[@]}"
            run_case madnlp-tol1e-7-mumps 4 1e-7 \
              "${madnlp_common[@]}" --madnlp-linear-solver mumps
            run_case madnlp-tol1e-7-umfpack 4 1e-7 \
              "${madnlp_common[@]}" --madnlp-linear-solver umfpack
          fi

      - name: Upload the option-screen JSON and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cycling-option-screen-${{ matrix.solver }}-${{ github.run_id }}
          path: benchmark-option-screen/
          if-no-files-found: warn
          retention-days: 30

  benchmark:
    name: ${{ matrix.solver }} — ${{ inputs.cycles }} RHO
    if: inputs.cycles != 'screen'
    needs: prepare-seed
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - solver: ipopt
            bioptim_commit: 346eb1d445e6ba67010b96c6f16ba830185119e7
            integration_branch: codex/madnlp-integration-master
            casadi_cxx_abi: 0
          - solver: madnlp
            bioptim_commit: 346eb1d445e6ba67010b96c6f16ba830185119e7
            integration_branch: codex/madnlp-integration-master
            casadi_cxx_abi: 0
          - solver: alpaqa
            bioptim_commit: d84e7e43534360fc048e0be26a3bd69a2abc2d77
            integration_branch: codex/alpaqa-integration
            casadi_cxx_abi: 1
    env:
      # The official CasADi wheel uses ABI 0. The source-built Alpaqa stack
      # links Conda IPOPT (ABI 1), so CasADi, RBDL and biorbd must all use 1.
      CASADI_CXX_ABI: ${{ matrix.casadi_cxx_abi }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Cocofest
        uses: actions/checkout@v6

      - name: Checkout the pinned Bioptim solver integration
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BIOPTIM_REPOSITORY }}
          ref: ${{ matrix.bioptim_commit }}
          path: .benchmark-deps/bioptim

      - name: Set up the Linux benchmark environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: cocofest-cycling-benchmark
          environment-file: .github/cycling-benchmark-linux-environment.yml
          conda-remove-defaults: true

      - name: Detect the CPU allocation
        run: |
          # GNU nproc honors OMP_NUM_THREADS. Ignore that solver safeguard
          # while detecting the CPU allocation used for builds and OCP threads.
          available_cores="$(env -u OMP_NUM_THREADS -u OMP_THREAD_LIMIT nproc)"
          if [[ "$available_cores" -lt 1 ]]; then
            echo "No CPU was reported by nproc." >&2
            exit 1
          fi
          echo "BENCHMARK_THREADS=$available_cores" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$available_cores" >> "$GITHUB_ENV"
          lscpu
          grep '^Cpus_allowed_list' /proc/self/status || true

      - name: Cache the MadNLP runtime
        if: matrix.solver != 'alpaqa'
        id: madnlp-cache
        uses: actions/cache@v6
        with:
          path: .cache/madnlp
          key: madnlp-cpu-jl1.10.4-linux-${{ env.MADNLP_SHA256 }}

      - name: Install the MadNLP runtime
        if: matrix.solver != 'alpaqa' && steps.madnlp-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/madnlp
          curl --fail --location --retry 3 "$MADNLP_URL" \
            --output "/tmp/$MADNLP_ARCHIVE"
          echo "$MADNLP_SHA256  /tmp/$MADNLP_ARCHIVE" | sha256sum --check
          unzip -q "/tmp/$MADNLP_ARCHIVE" -d .cache/madnlp

      - name: Configure the MadNLP runtime
        if: matrix.solver != 'alpaqa'
        run: |
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/madnlp/foo/lib:${LD_LIBRARY_PATH:-}" \
            >> "$GITHUB_ENV"

      - name: Install CasADi with IPOPT and MadNLP
        if: matrix.solver != 'alpaqa'
        run: python -m pip install --no-deps "casadi==$CASADI_VERSION"

      - name: Build CasADi with IPOPT and Alpaqa
        if: matrix.solver == 'alpaqa'
        run: bash .github/scripts/install_casadi_alpaqa_linux.sh

      - name: Install biorbd and Bioptim
        run: |
          bash .github/scripts/install_biorbd_casadi_linux.sh
          python -m pip install --no-deps -e .benchmark-deps/bioptim

      - name: Download the validated common continuation seed
        uses: actions/download-artifact@v8
        with:
          name: cycling-assisted-common-seed-${{ github.run_id }}
          path: benchmark-seed

      - name: Verify the solver environment
        env:
          PYTHONPATH: ${{ github.workspace }}
          BENCHMARK_SOLVER: ${{ matrix.solver }}
        run: |
          python - <<'PY'
          import math
          import os
          import casadi as cas
          import bioptim
          import biorbd_casadi as biorbd

          target = os.environ["BENCHMARK_SOLVER"]
          print(f"CasADi {cas.__version__}")
          print(f"Bioptim {bioptim.__version__}")
          print(f"biorbd {biorbd.__version__}")
          compiler_flags = cas.CasadiMeta.compiler_flags()
          print(f"CasADi compiler flags: {compiler_flags}")
          assert "-DCASADI_WITH_THREAD" in compiler_flags
          for solver in ("ipopt", target):
              available = cas.has_nlpsol(solver)
              print(f"{solver}: {available}")
              assert available, solver
          if target == "madnlp":
              assert hasattr(bioptim.Solver, "MADNLP")
          if target == "alpaqa":
              assert hasattr(bioptim.Solver, "ALPAQA")

          x = cas.MX.sym("x")
          plugin_options = {"print_time": False}
          if target == "ipopt":
              plugin_options["ipopt"] = {"print_level": 0, "max_iter": 50}
          elif target == "madnlp":
              plugin_options["madnlp"] = {
                  "print_level": 0,
                  "max_iter": 50,
                  "tol": 1e-8,
              }
          smoke = cas.nlpsol(
              f"{target}_smoke",
              target,
              {"x": x, "f": (x - 1) ** 2, "g": x},
              plugin_options,
          )
          smoke_result = smoke(x0=0, lbg=1, ubg=1)
          smoke_x = float(smoke_result["x"])
          smoke_error = abs(smoke_x - 1.0)
          smoke_tolerance = 1e-3 if target == "alpaqa" else 1e-6
          print(
              f"{target} minimal solution: x={smoke_x:.12g}, "
              f"error={smoke_error:.3e}, tolerance={smoke_tolerance:.1e}"
          )
          assert math.isfinite(smoke_x)
          assert smoke_error < smoke_tolerance
          print(f"{target} minimal solve: {smoke.stats()}")
          PY
          python -m pytest -q \
            tests/shard1/test_solver_backends.py \
            tests/shard1/test_biorbd_backend_conversion.py \
            tests/shard1/test_plot_backend.py \
            tests/test_solver_option_screen_summary.py \
            tests/shard1/test_periodic_pulse_width.py::test_common_primal_threshold_is_independent_of_nlp_solver_tolerance \
            tests/shard1/test_periodic_pulse_width.py::test_github_benchmark_compares_physical_threshold_not_solver_tolerance

      - name: Run the ${{ matrix.solver }} assisted benchmark
        env:
          PYTHONPATH: ${{ github.workspace }}
          BENCHMARK_CYCLES: ${{ inputs.cycles }}
          BENCHMARK_ASSISTANCE: ${{ inputs.crank_assistance_nm }}
          BENCHMARK_Q_SLACK: ${{ inputs.terminal_wheel_q_slack }}
          BENCHMARK_MAX_ITER: ${{ inputs.solver_max_iterations }}
          BENCHMARK_SOLVER: ${{ matrix.solver }}
          COCOFEST_BENCHMARK_COMMIT: ${{ github.sha }}
          BIOPTIM_BENCHMARK_COMMIT: ${{ matrix.bioptim_commit }}
          BIOPTIM_INTEGRATION_BRANCH: ${{ matrix.integration_branch }}
        run: |
          mkdir -p benchmark-results
          solver_options=()
          solver_tolerance=1e-6
          if [[ "$BENCHMARK_SOLVER" == "ipopt" ]]; then
            solver_options+=(
              --ipopt-max-iter "$BENCHMARK_MAX_ITER"
              --ipopt-dual-warm-start-mode bounds
            )
          elif [[ "$BENCHMARK_SOLVER" == "madnlp" ]]; then
            solver_tolerance=1e-8
            # The pinned madnlp_c runtime rejects max_wall_time, mu_init and
            # dual_initialized. Cocofest still supplies the shifted/projected
            # primal trajectory; the job timeout is the outer safety limit.
            solver_options+=(
              --madnlp-max-iter "$BENCHMARK_MAX_ITER"
              --madnlp-dual-warm-start-mode off
              --optional-nlp-periodic-ipopt-hot-start
            )
          else
            solver_options+=(
              --alpaqa-max-iter "$BENCHMARK_MAX_ITER"
              --alpaqa-alm-max-iter "$BENCHMARK_MAX_ITER"
              --alpaqa-max-wall-time 600
              --alpaqa-panoc-max-wall-time 20
              --alpaqa-initial-penalty 0
              # Do not reuse multipliers from a time-limited or otherwise
              # invalid RHO. The shifted/projected primal remains enabled.
              --alpaqa-dual-warm-start-mode off
              --optional-nlp-periodic-ipopt-hot-start
            )
          fi

          set -o pipefail
          python examples/fes_multibody/cycling/cycling_fes_solver_comparison.py \
            --solvers "$BENCHMARK_SOLVER" \
            --objective fatigue \
            --ipopt-profile periodic_collocation \
            --cycles-per-window 1 \
            --stimulations-per-cycle 30 \
            --n-windows "$BENCHMARK_CYCLES" \
            --n-threads "$BENCHMARK_THREADS" \
            --crank-assistance "$BENCHMARK_ASSISTANCE" \
            --nlp-tolerance "$solver_tolerance" \
            --primal-feasibility-threshold 1e-5 \
            --max-consecutive-failing 2 \
            --standard-warmup-seed benchmark-seed/common-continuation-warmup.npz \
            --legacy-standard-warmup-seed-signed-torque 0.22 \
            --standard-warmup-seed-continuation \
            --warmup-ipopt-linear-solver mumps \
            --ipopt-linear-solver mumps \
            --ipopt-disable-historical-initial-guess \
            --state-scaling full \
            --first-node-wheel-q-slack 0 \
            --terminal-wheel-q-slack "$BENCHMARK_Q_SLACK" \
            --compact-rho-output \
            --print-traces \
            --output-json "$GITHUB_WORKSPACE/benchmark-results/${BENCHMARK_SOLVER}.json" \
            "${solver_options[@]}" \
            2>&1 | tee "benchmark-results/${BENCHMARK_SOLVER}.log"

      - name: Add the result to the job summary
        if: always()
        shell: bash
        env:
          BENCHMARK_SOLVER: ${{ matrix.solver }}
        run: |
          result="benchmark-results/${BENCHMARK_SOLVER}.json"
          if [[ ! -f "$result" ]]; then
            echo "### ${BENCHMARK_SOLVER}: no JSON result" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### ${BENCHMARK_SOLVER}"
            echo
            echo "| Field | Value |"
            echo "|---|---:|"
            jq -r '
              .results[0] |
              "| Success | \(.success) |",
              "| Validated cycles | \(.validated_cycles) |",
              "| Attempted RHO | \(.attempted_windows) |",
              "| End-to-end wall (s) | \(.end_to_end_wall_time_s) |",
              "| Setup + initial guess (s) | \(.initial_guess_preparation_time_s) |",
              "| Sum attempted RHO wall (s) | \(.attempted_rho_wall_time_sum_s) |",
              "| Unattributed pipeline wall (s) | \(.unattributed_wall_time_s) |",
              "| Hot RHO wall median (s) | \(.hot_wall_time_median_s) |",
              "| Hot RHO wall P90 (s) | \(.hot_wall_time_p90_s) |",
              "| First failed RHO | \(.first_failed_rho) |",
              "| Minimum A/A_scale | \(.min_A_capacity_ratio) |",
              "| Stop | \(.stop.label) |"
            ' "$result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark JSON and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cycling-fatigue-linux-${{ matrix.solver }}-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Require an attempted RHO without infrastructure errors
        if: always()
        shell: bash
        env:
          BENCHMARK_SOLVER: ${{ matrix.solver }}
        run: |
          result="benchmark-results/${BENCHMARK_SOLVER}.json"
          if [[ ! -f "$result" ]]; then
            echo "${BENCHMARK_SOLVER}: benchmark JSON is missing." >&2
            exit 1
          fi
          jq -e '
            .results[0] |
            (.attempted_windows > 0 and .error == null)
          ' "$result"

  screen-report:
    name: Aggregate solver option screen
    if: ${{ always() && inputs.cycles == 'screen' }}
    needs: screen-options
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout Cocofest
        uses: actions/checkout@v6

      - name: Download every available option-screen artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: cycling-option-screen-*-${{ github.run_id }}
          path: benchmark-option-screen-all
          merge-multiple: true

      - name: Build the option comparison
        run: |
          mkdir -p benchmark-option-screen-all benchmark-option-report
          mapfile -t result_files < <(
            find benchmark-option-screen-all -name '*.json' -type f | sort
          )
          if [[ "${#result_files[@]}" -eq 0 ]]; then
            message="No option-screen JSON was produced; inspect the solver jobs."
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "$message" > benchmark-option-report/NO_RESULTS.txt
            exit 1
          fi
          python .github/scripts/summarize_solver_option_screen.py \
            --output-dir benchmark-option-report \
            --common-feasibility-threshold 1e-5 \
            "${result_files[@]}"
          cat benchmark-option-report/solver-option-screen.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the combined option report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cycling-option-screen-report-${{ github.run_id }}
          path: |
            benchmark-option-report/
            benchmark-option-screen-all/
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Aggregate Kevin benchmark
    if: ${{ always() && inputs.cycles != 'screen' }}
    needs: benchmark
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout Cocofest
        uses: actions/checkout@v6

      - name: Download every available solver artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: cycling-fatigue-linux-*-${{ github.run_id }}
          path: benchmark-results-all
          merge-multiple: true

      - name: Build the comparison report
        run: |
          mkdir -p benchmark-results-all benchmark-report
          mapfile -t result_files < <(find benchmark-results-all -name '*.json' -type f | sort)
          if [[ "${#result_files[@]}" -eq 0 ]]; then
            message="No solver JSON was produced; inspect the prerequisite or matrix jobs."
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "$message" > benchmark-report/NO_RESULTS.txt
            exit 1
          fi
          python .github/scripts/summarize_cycling_benchmark.py \
            --output-dir benchmark-report \
            "${result_files[@]}"
          cat benchmark-report/benchmark-comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the combined Kevin report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cycling-fatigue-kevin-report-${{ github.run_id }}
          path: |
            benchmark-report/
            benchmark-results-all/
          if-no-files-found: warn
          retention-days: 30
