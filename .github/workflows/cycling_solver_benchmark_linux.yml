name: Cycling fatigue solvers — endurance benchmark
run-name: Cycling fatigue solvers — ${{ inputs.cycles }} RHO, assistance ${{ inputs.crank_assistance_nm }} N.m

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Linux runner (Ubuntu 24.04 or GCC/libgcc >= 13 required for MadNLP)
        required: true
        default: ubuntu-24.04
        type: string
      cycles:
        description: Number of RHO solves, "screen" for options, or "acados" for ACADOS-only smoke tests
        required: true
        default: "100"
        type: string
      cycles_per_window:
        description: Simultaneous cycles per OCP (1 for backend benchmark; 2 for memory/robustness study)
        required: true
        default: "1"
        type: string
      crank_assistance_nm:
        description: Driving crank assistance magnitude in N.m
        required: true
        default: "0.00"
        type: string
      terminal_wheel_q_slack:
        description: Absolute cycle-count crank-angle slack in radians
        required: true
        default: "0.002"
        type: string
      solver_max_iterations:
        description: Maximum NLP iterations for each RHO
        required: true
        default: "2000"
        type: string
      compile_nlp_evaluators:
        description: Compile IPOPT CasADi evaluators once and reuse them across all RHO (MadNLP unsupported)
        required: true
        default: true
        type: boolean
      seed_validation_max_iterations:
        description: Maximum IPOPT iterations used to validate the shared continuation seed
        required: true
        default: "2000"
        type: string
      acados_smoke_rhos:
        description: ACADOS SQP smoke-test RHO count (full and experimental reduced mechanics)
        required: true
        default: "100"
        type: string
      acados_option_rhos:
        description: Short RHO count for each ACADOS solver-option candidate
        required: true
        default: "5"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: cycling-fatigue-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CASADI_VERSION: "3.7.2"
  CASADI_COMMIT: f959d3175a444d763e4eda4aece48f4c5f4a6f90
  # Same 3.7.2 version, with the post-release libMad ABI integration.
  CASADI_MADNLP_COMMIT: 973b086f4dcda9f49cd9c1948432ae4b7ee54886
  # CasADi 3.7.2's sparse Alpaqa interface targets this compatibility fork.
  ALPAQA_COMMIT: bf9f87d59640501ea72f94aa6e2d4e62b20c677b
  BIOPTIM_REPOSITORY: mickaelbegon/BiorbdOptim
  # Dedicated multi-solver integration branch:
  # codex/cocofest-acados-v055-exploration
  BIOPTIM_PRODUCTION_COMMIT: a3499cab16d7605b8efa7255cf89f1af6a7c59c9
  BIOPTIM_ALPAQA_COMMIT: d84e7e43534360fc048e0be26a3bd69a2abc2d77
  ACADOS_COMMIT: 59d93e17d2985fdd73fc58b8a83ed8f83a024171
  ACADOS_INSTALL_SCRIPT_BLOB: 5ac8064ab613251e62560b5de8cbbb9550f5c5d0
  LIBMAD_REPOSITORY: mickaelbegon/libMad
  # This public libMad revision also contains PARDISO support, but the
  # benchmark certifies and selects only its built-in MumpsSolver.
  LIBMAD_COMMIT: 5529f23a6bff33c566ad954da38d352f1f172356
  JULIAC_COMMIT: 73be8587a80bbb65dab7acd71d406f72867a3571
  JULIA_VERSION: "1.12.6"
  CONDA_ENV_NAME: cocofest-cycling-benchmark
  NUMERICAL_STACK_CACHE_VERSION: v2
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  JULIA_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg
  MPLCONFIGDIR: /tmp/cocofest-matplotlib

jobs:
  prepare-seed:
    name: Validate the common continuation seed
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Cocofest
        uses: actions/checkout@v6

      - name: Checkout the pinned Bioptim integration
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BIOPTIM_REPOSITORY }}
          ref: ${{ env.BIOPTIM_PRODUCTION_COMMIT }}
          path: .benchmark-deps/bioptim

      - name: Set up the Linux benchmark environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ${{ env.CONDA_ENV_NAME }}
          conda-remove-defaults: true

      - name: Restore the official numerical stack
        id: official-stack-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CONDA }}/envs/${{ env.CONDA_ENV_NAME }}
          key: numerical-stack-${{ env.NUMERICAL_STACK_CACHE_VERSION }}-${{ inputs.runner_label }}-${{ runner.arch }}-official-casadi-${{ env.CASADI_VERSION }}-${{ hashFiles('.github/cycling-benchmark-linux-environment.yml', '.github/scripts/install_biorbd_casadi_linux.sh') }}

      - name: Install the benchmark dependencies
        if: steps.official-stack-cache.outputs.cache-hit != 'true'
        run: |
          conda env update \
            --name "$CONDA_ENV_NAME" \
            --file .github/cycling-benchmark-linux-environment.yml \
            --prune

      - name: Detect the CPU allocation
        run: |
          # GNU nproc honors OMP_NUM_THREADS. Ignore that solver safeguard
          # while detecting the CPU allocation used for builds and OCP threads.
          available_cores="$(env -u OMP_NUM_THREADS -u OMP_THREAD_LIMIT nproc)"
          echo "BENCHMARK_THREADS=$available_cores" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$available_cores" >> "$GITHUB_ENV"
          lscpu

      - name: Install the reference numerical stack
        if: steps.official-stack-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --no-deps "casadi==$CASADI_VERSION"
          bash .github/scripts/install_biorbd_casadi_linux.sh

      - name: Validate the restored official stack
        run: |
          python -c 'import casadi, biorbd_casadi, numpy, pytest'

      - name: Save the official numerical stack
        if: steps.official-stack-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CONDA }}/envs/${{ env.CONDA_ENV_NAME }}
          key: numerical-stack-${{ env.NUMERICAL_STACK_CACHE_VERSION }}-${{ inputs.runner_label }}-${{ runner.arch }}-official-casadi-${{ env.CASADI_VERSION }}-${{ hashFiles('.github/cycling-benchmark-linux-environment.yml', '.github/scripts/install_biorbd_casadi_linux.sh') }}

      - name: Install the pinned Bioptim integration
        run: python -m pip install --no-deps -e .benchmark-deps/bioptim

      - name: Validate the seed on the assisted target
        env:
          PYTHONPATH: ${{ github.workspace }}
          BENCHMARK_CYCLES_PER_WINDOW: ${{ inputs.cycles_per_window }}
        run: |
          mkdir -p benchmark-seed-result
          if [[ "$BENCHMARK_CYCLES_PER_WINDOW" != "1" && "$BENCHMARK_CYCLES_PER_WINDOW" != "2" ]]; then
            echo "cycles_per_window must be 1 or 2." >&2
            exit 1
          fi

          prepare_case() {
            local mechanics="$1"
            local mechanics_options=()
            if [[ "$mechanics" == "reduced" ]]; then
              mechanics_options+=(--mechanical-formulation reduced)
            else
              # Certify the full problem from the exact contact-manifold lift
              # of the already solved reduced theta/omega seed. Ding states
              # and PW are shared, while q/qdot are reconstructed exactly.
              mechanics_options+=(
                --common-initial-solution "$GITHUB_WORKSPACE/benchmark-seed-result/common-reduced.npz"
              )
            fi
            python examples/fes_multibody/cycling/cycling_fes_solver_comparison.py \
              --solvers ipopt \
              --objective fatigue \
              --ipopt-profile periodic_collocation \
              --ipopt-use-sx \
              --ipopt-enforce-start-constraints \
              --cycles-per-window "$BENCHMARK_CYCLES_PER_WINDOW" \
              --stimulations-per-cycle 30 \
              --n-windows "$BENCHMARK_CYCLES_PER_WINDOW" \
              --n-threads "$BENCHMARK_THREADS" \
              --crank-assistance "${{ inputs.crank_assistance_nm }}" \
              --standard-warmup-seed .github/benchmark-seeds/legacy-resistive-0p22-warmup.npz \
              --legacy-standard-warmup-seed-signed-torque 0.22 \
              --standard-warmup-seed-continuation \
              --warmup-ipopt-linear-solver mumps \
              --ipopt-linear-solver mumps \
              --ipopt-max-iter "${{ inputs.seed_validation_max_iterations }}" \
              --ipopt-disable-historical-initial-guess \
              --reduced-cycling-profile "$GITHUB_WORKSPACE/benchmark-seed-result/reduced-cycling-fourier12.npz" \
              --state-scaling full \
              --first-node-wheel-q-slack 0 \
              --terminal-wheel-q-slack "${{ inputs.terminal_wheel_q_slack }}" \
              --compact-rho-output \
              --print-traces \
              --common-initial-solution-output "$GITHUB_WORKSPACE/benchmark-seed-result/common-${mechanics}.npz" \
              --output-json "$GITHUB_WORKSPACE/benchmark-seed-result/seed-check-${mechanics}.json" \
              "${mechanics_options[@]}"
            jq -e '
              .results[0] |
              (.success == true and .attempted_windows == 1)
            ' "$GITHUB_WORKSPACE/benchmark-seed-result/seed-check-${mechanics}.json"
            test -s "$GITHUB_WORKSPACE/benchmark-seed-result/common-${mechanics}.npz"
          }

          prepare_case reduced
          prepare_case full

      - name: Upload the validated immutable common seed
        uses: actions/upload-artifact@v7
        with:
          name: cycling-assisted-common-seed-${{ github.run_id }}
          path: |
            benchmark-seed-result/common-*.npz
            benchmark-seed-result/reduced-cycling-fourier12.npz
          if-no-files-found: error
          retention-days: 30

  prepare-madnlp-stack:
    name: Prepare the cached MadNLP numerical stack
    # The long benchmark MadNLP runner restores/builds its own stack so IPOPT
    # never waits for MadNLP preparation. This pre-warm job is only
    # retained for the focused solver-option screen.
    if: inputs.cycles == 'screen'
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 90
    env:
      CASADI_CXX_ABI: "1"
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Cocofest
        uses: actions/checkout@v6

      - name: Checkout the pinned libMad runtime
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LIBMAD_REPOSITORY }}
          ref: ${{ env.LIBMAD_COMMIT }}
          path: .benchmark-deps/libMad

      - name: Set up the Linux benchmark environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ${{ env.CONDA_ENV_NAME }}
          conda-remove-defaults: true

      - name: Restore the MadNLP numerical stack
        id: madnlp-stack-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CONDA }}/envs/${{ env.CONDA_ENV_NAME }}
          key: numerical-stack-${{ env.NUMERICAL_STACK_CACHE_VERSION }}-${{ inputs.runner_label }}-${{ runner.arch }}-madnlp-mumps-${{ env.CASADI_MADNLP_COMMIT }}-${{ env.LIBMAD_COMMIT }}-${{ hashFiles('.github/cycling-benchmark-linux-environment.yml', '.github/scripts/install_biorbd_casadi_linux.sh', '.github/scripts/install_casadi_madnlp_linux.sh') }}

      - name: Install the benchmark dependencies
        if: steps.madnlp-stack-cache.outputs.cache-hit != 'true'
        run: |
          conda env update \
            --name "$CONDA_ENV_NAME" \
            --file .github/cycling-benchmark-linux-environment.yml \
            --prune

      - name: Detect the CPU allocation
        run: |
          available_cores="$(env -u OMP_NUM_THREADS -u OMP_THREAD_LIMIT nproc)"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$available_cores" >> "$GITHUB_ENV"

      - name: Restore the MadNLP runtime
        id: prepared-madnlp-runtime
        uses: actions/cache/restore@v6
        with:
          path: .cache/madnlp-mumps
          key: libmad-mumps-${{ inputs.runner_label }}-${{ runner.arch }}-julia-${{ env.JULIA_VERSION }}-${{ env.LIBMAD_COMMIT }}-${{ env.JULIAC_COMMIT }}

      - name: Verify the MadNLP host runtime
        run: bash .github/scripts/check_libmad_host_linux.sh

      - name: Install Julia for the MadNLP MUMPS runtime
        if: steps.prepared-madnlp-runtime.outputs.cache-hit != 'true'
        uses: julia-actions/install-juliaup@05d98a2ef433ca0723a8221e38c4723ea92b0c5f # v3.1.4
        with:
          channel: ${{ env.JULIA_VERSION }}

      - name: Build the MadNLP MUMPS runtime
        if: steps.prepared-madnlp-runtime.outputs.cache-hit != 'true'
        run: |
          bash .github/scripts/install_libmad_mumps_linux.sh \
            .benchmark-deps/libMad \
            .cache/madnlp-mumps \
            "$JULIAC_COMMIT"

      - name: Save the certified MadNLP runtime
        if: steps.prepared-madnlp-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/madnlp-mumps
          key: libmad-mumps-${{ inputs.runner_label }}-${{ runner.arch }}-julia-${{ env.JULIA_VERSION }}-${{ env.LIBMAD_COMMIT }}-${{ env.JULIAC_COMMIT }}

      - name: Configure the MadNLP runtime
        run: |
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/madnlp-mumps/lib:$GITHUB_WORKSPACE/.cache/madnlp-mumps/share/julia/lib:${LD_LIBRARY_PATH:-}" \
            >> "$GITHUB_ENV"

      - name: Build the MadNLP numerical stack
        if: steps.madnlp-stack-cache.outputs.cache-hit != 'true'
        run: |
          bash .github/scripts/install_casadi_madnlp_linux.sh .cache/madnlp-mumps
          bash .github/scripts/install_biorbd_casadi_linux.sh

      - name: Validate the MadNLP numerical stack
        run: |
          python - <<'PY'
          import biorbd_casadi
          import casadi as cas

          assert cas.has_nlpsol("ipopt")
          assert cas.has_nlpsol("madnlp")
          print(f"CasADi {cas.__version__}; biorbd {biorbd_casadi.__version__}")
          PY

      - name: Save the MadNLP numerical stack
        if: steps.madnlp-stack-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CONDA }}/envs/${{ env.CONDA_ENV_NAME }}
          key: numerical-stack-${{ env.NUMERICAL_STACK_CACHE_VERSION }}-${{ inputs.runner_label }}-${{ runner.arch }}-madnlp-mumps-${{ env.CASADI_MADNLP_COMMIT }}-${{ env.LIBMAD_COMMIT }}-${{ hashFiles('.github/cycling-benchmark-linux-environment.yml', '.github/scripts/install_biorbd_casadi_linux.sh', '.github/scripts/install_casadi_madnlp_linux.sh') }}

  prepare-acados-stack:
    name: Prepare the cached ACADOS numerical stack
    if: ${{ inputs.cycles != 'screen' && inputs.cycles_per_window == '1' }}
    needs: prepare-seed
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Cocofest
        uses: actions/checkout@v6

      - name: Set up the Linux benchmark environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ${{ env.CONDA_ENV_NAME }}
          conda-remove-defaults: true

      - name: Restore the ACADOS numerical stack
        id: acados-stack-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CONDA }}/envs/${{ env.CONDA_ENV_NAME }}
          key: numerical-stack-${{ env.NUMERICAL_STACK_CACHE_VERSION }}-${{ inputs.runner_label }}-${{ runner.arch }}-acados-${{ env.ACADOS_COMMIT }}-${{ env.ACADOS_INSTALL_SCRIPT_BLOB }}-casadi-${{ env.CASADI_VERSION }}-${{ hashFiles('.github/cycling-benchmark-linux-environment.yml', '.github/scripts/install_biorbd_casadi_linux.sh') }}

      - name: Restore the official numerical stack
        if: steps.acados-stack-cache.outputs.cache-hit != 'true'
        id: acados-official-stack-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CONDA }}/envs/${{ env.CONDA_ENV_NAME }}
          key: numerical-stack-${{ env.NUMERICAL_STACK_CACHE_VERSION }}-${{ inputs.runner_label }}-${{ runner.arch }}-official-casadi-${{ env.CASADI_VERSION }}-${{ hashFiles('.github/cycling-benchmark-linux-environment.yml', '.github/scripts/install_biorbd_casadi_linux.sh') }}

      - name: Checkout the pinned ACADOS source through Bioptim
        if: steps.acados-stack-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BIOPTIM_REPOSITORY }}
          ref: ${{ env.BIOPTIM_PRODUCTION_COMMIT }}
          path: .benchmark-deps/bioptim-acados
          submodules: recursive

      - name: Install the benchmark dependencies
        if: |
          steps.acados-stack-cache.outputs.cache-hit != 'true' &&
          steps.acados-official-stack-cache.outputs.cache-hit != 'true'
        run: |
          conda env update \
            --name "$CONDA_ENV_NAME" \
            --file .github/cycling-benchmark-linux-environment.yml \
            --prune

      - name: Detect the CPU allocation
        run: |
          available_cores="$(env -u OMP_NUM_THREADS -u OMP_THREAD_LIMIT nproc)"
          if [[ "$available_cores" -lt 1 ]]; then
            echo "No CPU was reported by nproc." >&2
            exit 1
          fi
          echo "BENCHMARK_THREADS=$available_cores" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$available_cores" >> "$GITHUB_ENV"
          lscpu

      - name: Install the reference numerical stack
        if: |
          steps.acados-stack-cache.outputs.cache-hit != 'true' &&
          steps.acados-official-stack-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --no-deps "casadi==$CASADI_VERSION"
          bash .github/scripts/install_biorbd_casadi_linux.sh

      - name: Verify the pinned ACADOS source
        if: steps.acados-stack-cache.outputs.cache-hit != 'true'
        run: |
          observed_commit="$(
            git -C .benchmark-deps/bioptim-acados/external/acados rev-parse HEAD
          )"
          echo "ACADOS source commit: $observed_commit"
          test "$observed_commit" = "$ACADOS_COMMIT"

      - name: Build and install ACADOS
        if: steps.acados-stack-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librhash-dev
          bash .benchmark-deps/bioptim-acados/external/acados_install_linux.sh \
            "$BENCHMARK_THREADS" \
            "$CONDA_PREFIX"

      - name: Validate the ACADOS numerical stack
        run: |
          test -f "$CONDA_PREFIX/lib/libacados.so"
          test -f "$CONDA_PREFIX/lib/libhpipm.so"
          python - <<'PY'
          import acados_template
          import biorbd_casadi
          import casadi as cas

          assert cas.has_nlpsol("ipopt")
          print(f"CasADi {cas.__version__}; biorbd {biorbd_casadi.__version__}")
          print(f"acados_template: {acados_template.__file__}")
          PY

      - name: Save the ACADOS numerical stack
        if: steps.acados-stack-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CONDA }}/envs/${{ env.CONDA_ENV_NAME }}
          key: numerical-stack-${{ env.NUMERICAL_STACK_CACHE_VERSION }}-${{ inputs.runner_label }}-${{ runner.arch }}-acados-${{ env.ACADOS_COMMIT }}-${{ env.ACADOS_INSTALL_SCRIPT_BLOB }}-casadi-${{ env.CASADI_VERSION }}-${{ hashFiles('.github/cycling-benchmark-linux-environment.yml', '.github/scripts/install_biorbd_casadi_linux.sh') }}

  acados-smoke:
    name: ACADOS — sequential full/reduced and option screen
    if: ${{ inputs.cycles != 'screen' && inputs.cycles_per_window == '1' }}
    needs: [prepare-seed, prepare-acados-stack]
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Cocofest
        uses: actions/checkout@v6

      - name: Checkout the pinned Bioptim integration
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BIOPTIM_REPOSITORY }}
          ref: ${{ env.BIOPTIM_PRODUCTION_COMMIT }}
          path: .benchmark-deps/bioptim

      - name: Set up the Linux benchmark environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ${{ env.CONDA_ENV_NAME }}
          conda-remove-defaults: true

      - name: Restore the ACADOS numerical stack
        id: smoke-acados-stack-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CONDA }}/envs/${{ env.CONDA_ENV_NAME }}
          key: numerical-stack-${{ env.NUMERICAL_STACK_CACHE_VERSION }}-${{ inputs.runner_label }}-${{ runner.arch }}-acados-${{ env.ACADOS_COMMIT }}-${{ env.ACADOS_INSTALL_SCRIPT_BLOB }}-casadi-${{ env.CASADI_VERSION }}-${{ hashFiles('.github/cycling-benchmark-linux-environment.yml', '.github/scripts/install_biorbd_casadi_linux.sh') }}
          fail-on-cache-miss: true

      - name: Detect the CPU allocation
        run: |
          available_cores="$(env -u OMP_NUM_THREADS -u OMP_THREAD_LIMIT nproc)"
          if [[ "$available_cores" -lt 1 ]]; then
            echo "No CPU was reported by nproc." >&2
            exit 1
          fi
          echo "BENCHMARK_THREADS=$available_cores" >> "$GITHUB_ENV"
          echo "OMP_NUM_THREADS=$available_cores" >> "$GITHUB_ENV"
          echo "OMP_THREAD_LIMIT=$available_cores" >> "$GITHUB_ENV"
          lscpu
          grep '^Cpus_allowed_list' /proc/self/status || true

      - name: Install the pinned Bioptim integration
        run: python -m pip install --no-deps -e .benchmark-deps/bioptim

      - name: Download the validated common continuation seed
        uses: actions/download-artifact@v8
        with:
          name: cycling-assisted-common-seed-${{ github.run_id }}
          path: benchmark-seed

      - name: Verify the ACADOS solver environment
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          test -f "$CONDA_PREFIX/lib/libacados.so"
          python - <<'PY'
          import acados_template
          import bioptim
          import biorbd_casadi
          import casadi as cas

          assert cas.has_nlpsol("ipopt")
          print(f"CasADi {cas.__version__}")
          print(f"Bioptim {bioptim.__version__}")
          print(f"biorbd {biorbd_casadi.__version__}")
          print(f"acados_template: {acados_template.__file__}")
          PY
          python -m pytest -q \
            tests/shard1/test_reduced_cycling.py \
            tests/shard1/test_periodic_pulse_width.py::test_acados_example_defaults_to_the_assisted_periodic_profile \
            tests/shard1/test_periodic_pulse_width.py::test_common_target_seed_enables_the_robust_acados_reference_preparation \
            tests/shard1/test_periodic_pulse_width.py::test_codegen_names_normalize_user_tag_for_casadi \
            tests/shard1/test_periodic_pulse_width.py::test_control_homotopy_can_relax_stationarity_without_relaxing_feasibility \
            tests/shard1/test_periodic_pulse_width.py::test_phase_one_maps_reduced_mechanics_without_classifying_them_as_fes \
            tests/shard1/test_periodic_pulse_width.py::test_reduced_theta_target_uses_absolute_cycle_reference_without_drift \
            tests/shard1/test_periodic_pulse_width.py::test_acados_irk_transfer_rollout_uses_scaled_variables_and_stage_data

      - name: Run ACADOS full/reduced and solver options sequentially
        env:
          PYTHONPATH: ${{ github.workspace }}
          ACADOS_SMOKE_RHOS: ${{ inputs.acados_smoke_rhos }}
          ACADOS_OPTION_RHOS: ${{ inputs.acados_option_rhos }}
          BENCHMARK_ASSISTANCE: ${{ inputs.crank_assistance_nm }}
          BENCHMARK_Q_SLACK: ${{ inputs.terminal_wheel_q_slack }}
          COCOFEST_BENCHMARK_COMMIT: ${{ github.sha }}
          BIOPTIM_BENCHMARK_COMMIT: ${{ env.BIOPTIM_PRODUCTION_COMMIT }}
          BIOPTIM_INTEGRATION_BRANCH: codex/cocofest-acados-v055-exploration
        run: |
          for count in "$ACADOS_SMOKE_RHOS" "$ACADOS_OPTION_RHOS"; do
            if ! [[ "$count" =~ ^[1-9][0-9]*$ ]]; then
              echo "ACADOS RHO counts must be strictly positive integers." >&2
              exit 1
            fi
          done
          mkdir -p acados-smoke-results
          : > acados-smoke-results/expected-cases.txt
          acados_extended=false
          if (( ACADOS_SMOKE_RHOS > 5 || ACADOS_OPTION_RHOS > 5 )); then
            acados_extended=true
          fi
          echo "$acados_extended" > acados-smoke-results/extended-campaign.txt
          run_case() {
            local variant="$1"
            local mechanics="$2"
            local rhos="$3"
            local nlp_solver="$4"
            local integrator="$5"
            local sim_steps="$6"
            local newton_iter="$7"
            local collocation_type=GAUSS_LEGENDRE
            local case_dir="$GITHUB_WORKSPACE/acados-smoke-results/${variant}-${mechanics}"
            local mechanics_options=()
            local solver_options=()
            local stationarity=1e-3
            mkdir -p "$case_dir"
            echo "${variant}-${mechanics}" >> acados-smoke-results/expected-cases.txt
            if [[ "$integrator" == "ERK" ]]; then
              collocation_type=EXPLICIT_RUNGE_KUTTA
            fi
            if [[ "$mechanics" == "reduced" ]]; then
              stationarity=5e-3
              # Keep the stable 10 us continuation region. A 50 us screen
              # allowed the triceps to consume the full radius and produced
              # consecutive dynamics failures at RHO 7-8. Rare recruitment
              # switches therefore need a projected retry, not a permanently
              # wider trust region.
              mechanics_options+=(
                --mechanical-formulation reduced
                --experimental-reduced-acados
                --acados-control-homotopy-window-growth 10
                --acados-control-homotopy-window-max-radius 1e-5
              )
            else
              # The full model needs the homotopy to construct a nearby
              # feasible point, but retaining the final ±1 us radius prevents
              # the SQP from following the physically required PW branch.
              mechanics_options+=(
                --acados-control-homotopy-release-final-radius
              )
            fi
            if [[ "$nlp_solver" == "SQP_RTI" ]]; then
              solver_options+=(
                --acados-globalization FIXED_STEP
                --acados-nlp-qp-tol-strategy FIXED_QP_TOL
                --acados-qpscaling-scale-objective NO_OBJECTIVE_SCALING
                --acados-qpscaling-scale-constraints NO_CONSTRAINT_SCALING
              )
            fi
            if [[ "$nlp_solver" == "SQP_WITH_FEASIBLE_QP" ]]; then
              # Let ACADOS prioritize restoration when the nominal QP is
              # inconsistent, then switch back to the nominal optimality step.
              solver_options+=(
                --acados-search-direction-mode BYRD_OMOJOKUN
                --acados-byrd-omojokon-slack-relaxation-factor 1.00001
              )
            fi
            if [[ "$variant" == "sqp-irk-reset-memory" ]]; then
              solver_options+=(
                --acados-reset-solver-before-solve
              )
            fi
            if [[ "$variant" == "sqp-irk-qp-hot" ]]; then
              solver_options+=(
                --acados-qp-cond-n 30
                --acados-qp-warm-start-level 2
                --acados-warm-start-first-qp
                --acados-warm-start-first-qp-from-nlp
              )
            fi
            if [[ "$variant" == "sqp-irk-fixed" ]]; then
              solver_options+=(
                --acados-globalization FIXED_STEP
              )
            fi
            if [[ "$variant" == "sqp-irk-anderson" ]]; then
              solver_options+=(
                --acados-globalization FIXED_STEP
                --acados-with-anderson-acceleration
                --acados-anderson-activation-threshold 0.1
              )
            fi
            if [[ "$variant" == *"-contact" ]]; then
              if [[ "$mechanics" != "full" ]]; then
                echo "All-node contact variants require full mechanics." >&2
                return 2
              fi
              solver_options+=(
                --full-contact-constraints-all-nodes
              )
            fi
            if [[ "$variant" == *"-contact-position" ]]; then
              if [[ "$mechanics" != "full" ]]; then
                echo "All-node contact-position variants require full mechanics." >&2
                return 2
              fi
              solver_options+=(
                --full-contact-position-all-nodes
              )
            fi
            if [[ "$variant" == "sqp-feasibility-qp-irk" ]]; then
              # Native two-stage path in one precompiled OCP: start with the
              # feasibility QP, then let ACADOS switch to the nominal fatigue
              # direction after restoration.
              solver_options=(
                --acados-search-direction-mode FEASIBILITY_QP
              )
            fi
            if [[ "$variant" == "sqp-irk-two-stage" ]]; then
              # Reuse the already compiled SQP OCP. Between RHO solves, first
              # restore a feasible transferred trajectory with relaxed state
              # bounds, tighten those bounds to the physical problem, and only
              # then run the normal fatigue-optimal SQP solve.
              solver_options+=(
                --acados-transfer-bound-homotopy
                --acados-transfer-bound-homotopy-fractions 0,1
                --acados-transfer-bound-homotopy-padding 0.05
                --acados-transfer-bound-homotopy-iterations 20
                --acados-transfer-bound-homotopy-tolerance 1e-4
                --acados-transfer-bound-homotopy-solver-tolerance 1e-4
              )
            fi
            if [[ "$variant" == *"-phase-one" ]]; then
              # Strict inter-RHO state bounds can make the cyclically shifted
              # guess discontinuous at node 0, especially for omega. Repair
              # the primal trajectory without changing the physical OCP.
              solver_options+=(
                --acados-transfer-phase-one
                --acados-transfer-phase-one-mode all
              )
            fi

            set +e
            set -o pipefail
            python examples/fes_multibody/cycling/cycling_fes_solver_comparison.py \
              --solvers acados \
              --objective fatigue \
              --ipopt-profile periodic_collocation \
              --ipopt-use-sx \
              --ipopt-enforce-start-constraints \
              --disable-periodic-ipopt-refinement \
              --cycles-per-window 1 \
              --stimulations-per-cycle 30 \
              --n-windows "$rhos" \
              --n-threads "$BENCHMARK_THREADS" \
              --crank-assistance "$BENCHMARK_ASSISTANCE" \
              --primal-feasibility-threshold 1e-5 \
              --max-consecutive-failing 2 \
              --standard-warmup-seed .github/benchmark-seeds/legacy-resistive-0p22-warmup.npz \
              --legacy-standard-warmup-seed-signed-torque 0.22 \
              --standard-warmup-seed-continuation \
              --common-initial-solution "benchmark-seed/common-reduced.npz" \
              --warmup-ipopt-linear-solver mumps \
              --ipopt-linear-solver mumps \
              --ipopt-disable-historical-initial-guess \
              --reduced-cycling-profile benchmark-seed/reduced-cycling-fourier12.npz \
              --state-scaling full \
              --first-node-wheel-q-slack 0 \
              --terminal-wheel-q-slack "$BENCHMARK_Q_SLACK" \
              --acados-dir "$CONDA_PREFIX" \
              --acados-check-reuse-possible \
              --acados-max-iter 100 \
              --acados-control-homotopy-radii 1e-6,1e-5 \
              --acados-control-homotopy-tolerance 2e-2 \
              --acados-nlp-solver-type "$nlp_solver" \
              --acados-integrator-type "$integrator" \
              --acados-collocation-type "$collocation_type" \
              --acados-sim-stages 4 \
              --acados-sim-steps "$sim_steps" \
              --acados-newton-iter "$newton_iter" \
              --acados-stationarity-tolerance "$stationarity" \
              --acados-diagnostics \
              --codegen-tag "ci-${variant}-${mechanics}" \
              --compact-rho-output \
              --print-traces \
              --output-json "$case_dir/result.json" \
              "${mechanics_options[@]}" \
              "${solver_options[@]}" \
              2>&1 | tee "$case_dir/solver.log"
            local solver_exit="${PIPESTATUS[0]}"
            set -e
            echo "$solver_exit" > "$case_dir/process-exit-code.txt"
          }

          if [[ "$acados_extended" == "false" ]]; then
            for mechanics in full reduced; do
              run_case sqp-irk-reference "$mechanics" "$ACADOS_SMOKE_RHOS" SQP IRK 5 5
              run_case sqp-irk-reset-memory "$mechanics" "$ACADOS_OPTION_RHOS" SQP IRK 5 5
              run_case sqp-irk-qp-hot "$mechanics" "$ACADOS_OPTION_RHOS" SQP IRK 5 5
              run_case sqp-irk-fixed "$mechanics" "$ACADOS_OPTION_RHOS" SQP IRK 5 5
              run_case sqp-irk-anderson "$mechanics" "$ACADOS_OPTION_RHOS" SQP IRK 5 5
              run_case sqp-irk-two-stage "$mechanics" "$ACADOS_SMOKE_RHOS" SQP IRK 5 5
              run_case sqp-feasible-qp-irk "$mechanics" "$ACADOS_SMOKE_RHOS" SQP_WITH_FEASIBLE_QP IRK 5 5
              run_case sqp-feasibility-qp-irk "$mechanics" "$ACADOS_SMOKE_RHOS" SQP_WITH_FEASIBLE_QP IRK 5 5
              run_case sqp-rti-irk "$mechanics" "$ACADOS_OPTION_RHOS" SQP_RTI IRK 5 5
              run_case sqp-erk "$mechanics" "$ACADOS_OPTION_RHOS" SQP ERK 20 5
              run_case sqp-irk-light "$mechanics" "$ACADOS_OPTION_RHOS" SQP IRK 2 3
              run_case sqp-irk-phase-one "$mechanics" "$ACADOS_SMOKE_RHOS" SQP IRK 5 5
              run_case sqp-rti-irk-phase-one "$mechanics" "$ACADOS_OPTION_RHOS" SQP_RTI IRK 5 5
            done
            run_case sqp-irk-contact full "$ACADOS_OPTION_RHOS" SQP IRK 5 5
            run_case sqp-rti-irk-contact full "$ACADOS_OPTION_RHOS" SQP_RTI IRK 5 5
            run_case sqp-irk-contact-position full "$ACADOS_OPTION_RHOS" SQP IRK 5 5
            run_case sqp-rti-irk-contact-position full "$ACADOS_OPTION_RHOS" SQP_RTI IRK 5 5
          else
            # Only candidates that passed the five-RHO physical screen are
            # rebuilt for 30/100 RHO. Keep the reference to quantify the gain.
            run_case sqp-irk-reference reduced "$ACADOS_SMOKE_RHOS" SQP IRK 5 5
            run_case sqp-irk-fixed reduced "$ACADOS_OPTION_RHOS" SQP IRK 5 5
            run_case sqp-irk-anderson reduced "$ACADOS_OPTION_RHOS" SQP IRK 5 5
            run_case sqp-rti-irk reduced "$ACADOS_OPTION_RHOS" SQP_RTI IRK 5 5
            run_case sqp-irk-light reduced "$ACADOS_OPTION_RHOS" SQP IRK 2 3
            run_case sqp-irk-contact-position full "$ACADOS_OPTION_RHOS" SQP IRK 5 5
            run_case sqp-rti-irk-contact-position full "$ACADOS_OPTION_RHOS" SQP_RTI IRK 5 5
          fi

      - name: Add every ACADOS result to the job summary
        if: always()
        run: |
          while IFS= read -r result; do
            case_name="$(basename "$(dirname "$result")")"
            {
              echo "### ACADOS / ${case_name}"
              echo
              echo "| Field | Value |"
              echo "|---|---:|"
              jq -r '
                .results[0] |
                "| Success | \(.success) |",
                "| NLP-validated cycles | \(.nlp_validated_cycles) |",
                "| Physically validated cycles | \(.physically_validated_cycles) |",
                "| Validated cycles | \(.validated_cycles) |",
                "| Attempted RHO | \(.attempted_windows) |",
                "| Preparation (s) | \(.initial_guess_preparation_time_s) |",
                "| Hot RHO median (s) | \(.hot_wall_time_median_s) |",
                "| Hot RHO P90 (s) | \(.hot_wall_time_p90_s) |",
                "| First failed RHO | \(.first_failed_rho) |",
                "| Stop | \(.stop.label) |"
              ' "$result"
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(find acados-smoke-results -name result.json -type f | sort)

      - name: Build the ACADOS option-screen table
        if: always()
        run: |
          output="acados-smoke-results/acados-option-screen.csv"
          echo "case,nlp_solver,search_direction,integrator,sim_steps,newton_iter,reset_solver,qp_warm_start,anderson,anderson_threshold,byrd_slack_factor,transfer_bound_homotopy,all_node_contact,all_node_contact_position,solver_success,physical_success,success,mechanical_audit_passed,nlp_validated_cycles,physically_validated_cycles,validated_cycles,attempted_rho,solve_hot_median_s,effective_hot_median_s,effective_hot_p90_s,restoration_total_s,executed_fatigue_objective,minimum_capacity_ratio,first_failed_rho" > "$output"
          while IFS= read -r result; do
            case_name="$(basename "$(dirname "$result")")"
            jq -r --arg case "$case_name" '
              .configurations.acados as $config |
              .results[0] |
              [
                $case,
                $config.acados_nlp_solver_type,
                $config.acados_search_direction_mode,
                $config.acados_integrator_type,
                $config.acados_sim_steps,
                $config.acados_newton_iter,
                $config.acados_reset_solver_before_solve,
                $config.acados_qp_warm_start_level,
                $config.acados_with_anderson_acceleration,
                $config.acados_anderson_activation_threshold,
                $config.acados_byrd_omojokon_slack_relaxation_factor,
                $config.acados_transfer_bound_homotopy,
                $config.full_contact_constraints_all_nodes,
                $config.full_contact_position_all_nodes,
                .solver_success,
                .physical_success,
                .success,
                .mechanical_equivalence_audit.passes_tolerance,
                .nlp_validated_cycles,
                .physically_validated_cycles,
                .validated_cycles,
                .attempted_windows,
                .hot_wall_time_median_s,
                .hot_effective_wall_time_median_s,
                .hot_effective_wall_time_p90_s,
                .feasibility_restoration.total_wall_time_s,
                .executed_fatigue_objective,
                .min_A_capacity_ratio,
                .first_failed_rho
              ] | @csv
            ' "$result" >> "$output"
          done < <(find acados-smoke-results -name result.json -type f | sort)

      - name: Upload separated ACADOS case directories
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cycling-acados-smoke-${{ github.run_id }}
          path: acados-smoke-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Require every ACADOS case without infrastructure errors
        if: always()
        run: |
          mapfile -t expected_cases < acados-smoke-results/expected-cases.txt
          if [[ "${#expected_cases[@]}" -lt 1 ]]; then
            echo "ACADOS: the expected-case manifest is empty." >&2
            exit 1
          fi
          mapfile -t results < <(find acados-smoke-results -name result.json -type f | sort)
          if [[ "${#results[@]}" -ne "${#expected_cases[@]}" ]]; then
            echo "ACADOS: expected ${#expected_cases[@]} JSON files, found ${#results[@]}." >&2
            exit 1
          fi
          for case_name in "${expected_cases[@]}"; do
            result="acados-smoke-results/${case_name}/result.json"
            if [[ ! -f "$result" ]]; then
              echo "ACADOS: missing expected case ${case_name}." >&2
              exit 1
            fi
            jq -e '
              (.configurations.acados.use_sx == true) and
              (
                .results[0] |
                (.solver != null)
              )
            ' "$result"
          done
          extended_campaign="$(cat acados-smoke-results/extended-campaign.txt)"
          for mechanics in full reduced; do
            result="acados-smoke-results/sqp-irk-reference-${mechanics}/result.json"
            jq -e --arg extended "$extended_campaign" '
              (.configurations.acados.use_sx == true) and
              (
                if $extended == "true"
                then .configurations.acados.n_windows > 5
                else true
                end
              ) and
              (
                .results[0] |
                (.attempted_windows > 0 and .error == null)
              )
            ' "$result"
          done

  screen-options:
    name: Option screen — ${{ matrix.solver }}
    if: inputs.cycles == 'screen'
    needs: [prepare-seed, prepare-madnlp-stack]
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - solver: madnlp
            backend: mumps
            bioptim_commit: 346eb1d445e6ba67010b96c6f16ba830185119e7
            integration_branch: codex/madnlp-integration-master
            casadi_cxx_abi: 1
          - solver: alpaqa
            backend: panoc
            bioptim_commit: d84e7e43534360fc048e0be26a3bd69a2abc2d77
            integration_branch: codex/alpaqa-integration
            casadi_cxx_abi: 1
    env:
      CASADI_CXX_ABI: ${{ matrix.casadi_cxx_abi }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Cocofest
        uses: actions/checkout@v6

      - name: Checkout the pinned Bioptim solver integration
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BIOPTIM_REPOSITORY }}
          ref: ${{ matrix.bioptim_commit }}
          path: .benchmark-deps/bioptim

      - name: Checkout the pinned libMad runtime
        if: matrix.solver == 'madnlp'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LIBMAD_REPOSITORY }}
          ref: ${{ env.LIBMAD_COMMIT }}
          path: .benchmark-deps/libMad

      - name: Set up the Linux benchmark environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ${{ env.CONDA_ENV_NAME }}
          conda-remove-defaults: true

      - name: Restore the MadNLP numerical stack
        if: matrix.solver == 'madnlp'
        id: screen-numerical-stack-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CONDA }}/envs/${{ env.CONDA_ENV_NAME }}
          key: numerical-stack-${{ env.NUMERICAL_STACK_CACHE_VERSION }}-${{ inputs.runner_label }}-${{ runner.arch }}-madnlp-mumps-${{ env.CASADI_MADNLP_COMMIT }}-${{ env.LIBMAD_COMMIT }}-${{ hashFiles('.github/cycling-benchmark-linux-environment.yml', '.github/scripts/install_biorbd_casadi_linux.sh', '.github/scripts/install_casadi_madnlp_linux.sh') }}

      - name: Install the benchmark dependencies
        if: matrix.solver != 'madnlp' || steps.screen-numerical-stack-cache.outputs.cache-hit != 'true'
        run: |
          conda env update \
            --name "$CONDA_ENV_NAME" \
            --file .github/cycling-benchmark-linux-environment.yml \
            --prune

      - name: Detect the CPU allocation
        run: |
          available_cores="$(env -u OMP_NUM_THREADS -u OMP_THREAD_LIMIT nproc)"
          if [[ "$available_cores" -lt 1 ]]; then
            echo "No CPU was reported by nproc." >&2
            exit 1
          fi
          echo "BENCHMARK_THREADS=$available_cores" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$available_cores" >> "$GITHUB_ENV"
          lscpu
          grep '^Cpus_allowed_list' /proc/self/status || true

      - name: Cache the MadNLP runtime
        if: matrix.solver == 'madnlp'
        id: screen-madnlp-cache
        uses: actions/cache@v6
        with:
          path: .cache/madnlp-mumps
          key: libmad-mumps-${{ inputs.runner_label }}-${{ runner.arch }}-julia-${{ env.JULIA_VERSION }}-${{ env.LIBMAD_COMMIT }}-${{ env.JULIAC_COMMIT }}

      - name: Verify the MadNLP host runtime
        if: matrix.solver == 'madnlp'
        run: bash .github/scripts/check_libmad_host_linux.sh

      - name: Install Julia for the MadNLP MUMPS runtime
        if: matrix.solver == 'madnlp' && steps.screen-madnlp-cache.outputs.cache-hit != 'true'
        uses: julia-actions/install-juliaup@05d98a2ef433ca0723a8221e38c4723ea92b0c5f # v3.1.4
        with:
          channel: ${{ env.JULIA_VERSION }}

      - name: Build the MadNLP MUMPS runtime
        if: matrix.solver == 'madnlp' && steps.screen-madnlp-cache.outputs.cache-hit != 'true'
        run: |
          bash .github/scripts/install_libmad_mumps_linux.sh \
            .benchmark-deps/libMad \
            .cache/madnlp-mumps \
            "$JULIAC_COMMIT"

      - name: Save the certified MadNLP runtime
        if: matrix.solver == 'madnlp' && steps.screen-madnlp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/madnlp-mumps
          key: libmad-mumps-${{ inputs.runner_label }}-${{ runner.arch }}-julia-${{ env.JULIA_VERSION }}-${{ env.LIBMAD_COMMIT }}-${{ env.JULIAC_COMMIT }}

      - name: Configure the MadNLP runtime
        if: matrix.solver == 'madnlp'
        run: |
          test -f .cache/madnlp-mumps/lib/libMad.so
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/madnlp-mumps/lib:$GITHUB_WORKSPACE/.cache/madnlp-mumps/share/julia/lib:${LD_LIBRARY_PATH:-}" \
            >> "$GITHUB_ENV"
          echo "LIBMAD_BENCHMARK_COMMIT=$LIBMAD_COMMIT" >> "$GITHUB_ENV"

      - name: Build CasADi with the libMad ABI
        if: matrix.solver == 'madnlp' && steps.screen-numerical-stack-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/install_casadi_madnlp_linux.sh .cache/madnlp-mumps

      - name: Build CasADi with IPOPT and Alpaqa
        if: matrix.solver == 'alpaqa'
        run: bash .github/scripts/install_casadi_alpaqa_linux.sh

      - name: Install biorbd and Bioptim
        run: |
          if [[ "${{ matrix.solver }}" != "madnlp" || \
                "${{ steps.screen-numerical-stack-cache.outputs.cache-hit }}" != "true" ]]; then
            bash .github/scripts/install_biorbd_casadi_linux.sh
          fi
          python -m pip install --no-deps -e .benchmark-deps/bioptim

      - name: Download the validated common continuation seed
        uses: actions/download-artifact@v8
        with:
          name: cycling-assisted-common-seed-${{ github.run_id }}
          path: benchmark-seed

      - name: Verify the option-screen environment
        env:
          PYTHONPATH: ${{ github.workspace }}
          BENCHMARK_SOLVER: ${{ matrix.solver }}
          BENCHMARK_BACKEND: ${{ matrix.backend }}
        run: |
          python - <<'PY'
          import os
          import casadi as cas
          import bioptim

          solver = os.environ["BENCHMARK_SOLVER"]
          print(f"CasADi {cas.__version__}")
          print(f"Bioptim {bioptim.__version__}")
          print(f"CasADi compiler flags: {cas.CasadiMeta.compiler_flags()}")
          assert "-DCASADI_WITH_THREAD" in cas.CasadiMeta.compiler_flags()
          assert cas.has_nlpsol("ipopt")
          assert cas.has_nlpsol(solver)
          assert hasattr(bioptim.Solver, solver.upper())
          PY
          python -m pytest -q \
            tests/shard1/test_solver_backends.py \
            tests/test_cycling_benchmark_summary.py \
            tests/test_solver_option_screen_summary.py \
            tests/shard1/test_periodic_pulse_width.py::test_stimulation_snapshots_use_one_based_cycles_and_real_crank_phase \
            tests/shard1/test_periodic_pulse_width.py::test_common_primal_threshold_is_independent_of_nlp_solver_tolerance \
            tests/shard1/test_periodic_pulse_width.py::test_github_benchmark_compares_physical_threshold_not_solver_tolerance \
            tests/shard1/test_periodic_pulse_width.py::test_common_initial_solution_metadata_rejects_an_incompatible_horizon \
            tests/shard1/test_periodic_pulse_width.py::test_common_initial_solution_metadata_allows_a_transcription_change \
            tests/shard1/test_periodic_pulse_width.py::test_common_initial_solution_metadata_rejects_a_different_warmup_cycle \
            tests/shard1/test_periodic_pulse_width.py::test_periodic_node_projection_uses_all_five_ding_states \
            tests/shard1/test_periodic_pulse_width.py::test_phase_one_maps_reduced_mechanics_without_classifying_them_as_fes \
            tests/shard1/test_periodic_pulse_width.py::test_common_target_seed_enables_the_robust_acados_reference_preparation

      - name: Run the focused ${{ matrix.solver }} option screen
        env:
          PYTHONPATH: ${{ github.workspace }}
          BENCHMARK_ASSISTANCE: ${{ inputs.crank_assistance_nm }}
          BENCHMARK_Q_SLACK: ${{ inputs.terminal_wheel_q_slack }}
          BENCHMARK_SOLVER: ${{ matrix.solver }}
          COCOFEST_BENCHMARK_COMMIT: ${{ github.sha }}
          BIOPTIM_BENCHMARK_COMMIT: ${{ matrix.bioptim_commit }}
          BIOPTIM_INTEGRATION_BRANCH: ${{ matrix.integration_branch }}
        run: |
          mkdir -p benchmark-option-screen

          run_case() {
            local variant="$1"
            local windows="$2"
            local tolerance="$3"
            shift 3
            echo "::group::${variant}"
            set -o pipefail
            python examples/fes_multibody/cycling/cycling_fes_solver_comparison.py \
              --solvers "$BENCHMARK_SOLVER" \
              --objective fatigue \
              --ipopt-profile periodic_collocation \
              --ipopt-use-sx \
              --ipopt-enforce-start-constraints \
              --cycles-per-window 1 \
              --stimulations-per-cycle 30 \
              --n-windows "$windows" \
              --n-threads "$BENCHMARK_THREADS" \
              --crank-assistance "$BENCHMARK_ASSISTANCE" \
              --nlp-tolerance "$tolerance" \
              --primal-feasibility-threshold 1e-5 \
              --max-consecutive-failing 2 \
              --standard-warmup-seed .github/benchmark-seeds/legacy-resistive-0p22-warmup.npz \
              --legacy-standard-warmup-seed-signed-torque 0.22 \
              --standard-warmup-seed-continuation \
              --common-initial-solution benchmark-seed/common-reduced.npz \
              --no-optional-nlp-periodic-ipopt-hot-start \
              --warmup-ipopt-linear-solver mumps \
              --ipopt-linear-solver mumps \
              --ipopt-disable-historical-initial-guess \
              --reduced-cycling-profile benchmark-seed/reduced-cycling-fourier12.npz \
              --state-scaling full \
              --first-node-wheel-q-slack 0 \
              --terminal-wheel-q-slack "$BENCHMARK_Q_SLACK" \
              --compact-rho-output \
              --print-traces \
              --output-json "$GITHUB_WORKSPACE/benchmark-option-screen/${variant}.json" \
              "$@" \
              2>&1 | tee "benchmark-option-screen/${variant}.log"
            if grep -Fq \
              "libMAD WARNING: option linear_solver is of unknown type" \
              "benchmark-option-screen/${variant}.log"
            then
              echo "libMad rejected the requested linear_solver type." >&2
              exit 1
            fi
            jq -e '
              (.configurations | to_entries | all(.value.use_sx == true)) and
              (
                .results[0] |
                (.attempted_windows > 0 and .error == null)
              )
            ' \
              "benchmark-option-screen/${variant}.json"
            echo "::endgroup::"
          }

          if [[ "$BENCHMARK_SOLVER" == "alpaqa" ]]; then
            alpaqa_common=(
              --alpaqa-max-iter 2000
              --alpaqa-alm-max-iter 100
              --alpaqa-max-wall-time 60
              --alpaqa-dual-warm-start-mode off
            )
            run_case alpaqa-panoc60-default 1 1e-6 \
              "${alpaqa_common[@]}" --alpaqa-panoc-max-wall-time 60
            run_case alpaqa-panoc20-default 1 1e-6 \
              "${alpaqa_common[@]}" --alpaqa-panoc-max-wall-time 20
            run_case alpaqa-panoc5-default 1 1e-6 \
              "${alpaqa_common[@]}" --alpaqa-panoc-max-wall-time 5
            run_case alpaqa-panoc20-auto-penalty 1 1e-6 \
              "${alpaqa_common[@]}" --alpaqa-panoc-max-wall-time 20 \
              --alpaqa-initial-penalty 0
            run_case alpaqa-panoc20-penalty0p01 1 1e-6 \
              "${alpaqa_common[@]}" --alpaqa-panoc-max-wall-time 20 \
              --alpaqa-initial-penalty 0.01
            run_case alpaqa-panoc20-penalty0p01-factor2 1 1e-6 \
              "${alpaqa_common[@]}" --alpaqa-panoc-max-wall-time 20 \
              --alpaqa-initial-penalty 0.01 \
              --alpaqa-penalty-update-factor 2
          else
            madnlp_common=(
              --madnlp-max-iter 2000
              --madnlp-linear-solver mumps
              --madnlp-dual-warm-start-mode off
            )
            run_case madnlp-tol1e-6-default 4 1e-6 "${madnlp_common[@]}"
            run_case madnlp-tol1e-7-default 4 1e-7 "${madnlp_common[@]}"
            run_case madnlp-tol1e-8-default 4 1e-8 "${madnlp_common[@]}"
            run_case madnlp-tol1e-7-mumps 4 1e-7 "${madnlp_common[@]}"
          fi

      - name: Upload the option-screen JSON and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cycling-option-screen-${{ matrix.solver }}-${{ github.run_id }}
          path: benchmark-option-screen/
          if-no-files-found: warn
          retention-days: 30

  benchmark:
    name: ${{ matrix.case_slug }} — sequential full/reduced
    if: ${{ inputs.cycles != 'screen' && inputs.cycles != 'acados' }}
    needs: prepare-seed
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - solver: ipopt
            backend: mumps
            case_slug: ipopt
            benchmark_mode: main
            timeout_minutes: 300
            benchmark_rhos: ${{ inputs.cycles }}
            cycles_per_window: ${{ inputs.cycles_per_window }}
            bioptim_commit: a3499cab16d7605b8efa7255cf89f1af6a7c59c9
            integration_branch: codex/cocofest-acados-v055-exploration
            casadi_cxx_abi: 0
          - solver: madnlp
            backend: mumps
            case_slug: madnlp
            benchmark_mode: main
            timeout_minutes: 420
            benchmark_rhos: ${{ inputs.cycles }}
            cycles_per_window: ${{ inputs.cycles_per_window }}
            bioptim_commit: a3499cab16d7605b8efa7255cf89f1af6a7c59c9
            integration_branch: codex/cocofest-acados-v055-exploration
            casadi_cxx_abi: 1
          - solver: fatrop
            backend: fatrop
            case_slug: fatrop-collocation
            benchmark_mode: main
            timeout_minutes: 420
            benchmark_rhos: ${{ inputs.cycles }}
            cycles_per_window: ${{ inputs.cycles_per_window }}
            bioptim_commit: a3499cab16d7605b8efa7255cf89f1af6a7c59c9
            integration_branch: codex/cocofest-acados-v055-exploration
            casadi_cxx_abi: 0
    env:
      # IPOPT uses the wheel ABI; source-built CasADi/libMad follows
      # Conda's modern libstdc++ ABI.
      CASADI_CXX_ABI: ${{ matrix.casadi_cxx_abi }}
      PYTHONPATH: ${{ github.workspace }}
      BENCHMARK_RHOS: ${{ matrix.benchmark_rhos }}
      BENCHMARK_CYCLES_PER_WINDOW: ${{ matrix.cycles_per_window }}
      BENCHMARK_ASSISTANCE: ${{ inputs.crank_assistance_nm }}
      BENCHMARK_Q_SLACK: ${{ inputs.terminal_wheel_q_slack }}
      BENCHMARK_MAX_ITER: ${{ inputs.solver_max_iterations }}
      BENCHMARK_SOLVER: ${{ matrix.solver }}
      COCOFEST_BENCHMARK_COMMIT: ${{ github.sha }}
      BIOPTIM_BENCHMARK_COMMIT: ${{ matrix.bioptim_commit }}
      BIOPTIM_INTEGRATION_BRANCH: ${{ matrix.integration_branch }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Cocofest
        uses: actions/checkout@v6

      - name: Checkout the pinned Bioptim solver integration
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BIOPTIM_REPOSITORY }}
          ref: ${{ matrix.bioptim_commit }}
          path: .benchmark-deps/bioptim

      - name: Checkout the pinned libMad runtime
        if: matrix.solver == 'madnlp'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LIBMAD_REPOSITORY }}
          ref: ${{ env.LIBMAD_COMMIT }}
          path: .benchmark-deps/libMad

      - name: Set up the Linux benchmark environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ${{ env.CONDA_ENV_NAME }}
          conda-remove-defaults: true

      - name: Restore the official numerical stack
        if: matrix.solver != 'madnlp'
        id: benchmark-official-stack-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CONDA }}/envs/${{ env.CONDA_ENV_NAME }}
          key: numerical-stack-${{ env.NUMERICAL_STACK_CACHE_VERSION }}-${{ inputs.runner_label }}-${{ runner.arch }}-official-casadi-${{ env.CASADI_VERSION }}-${{ hashFiles('.github/cycling-benchmark-linux-environment.yml', '.github/scripts/install_biorbd_casadi_linux.sh') }}

      - name: Restore the MadNLP numerical stack
        if: matrix.solver == 'madnlp'
        id: benchmark-madnlp-stack-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CONDA }}/envs/${{ env.CONDA_ENV_NAME }}
          key: numerical-stack-${{ env.NUMERICAL_STACK_CACHE_VERSION }}-${{ inputs.runner_label }}-${{ runner.arch }}-madnlp-mumps-${{ env.CASADI_MADNLP_COMMIT }}-${{ env.LIBMAD_COMMIT }}-${{ hashFiles('.github/cycling-benchmark-linux-environment.yml', '.github/scripts/install_biorbd_casadi_linux.sh', '.github/scripts/install_casadi_madnlp_linux.sh') }}

      - name: Install the benchmark dependencies
        if: |
          (matrix.solver == 'madnlp' && steps.benchmark-madnlp-stack-cache.outputs.cache-hit != 'true') ||
          (matrix.solver != 'madnlp' && steps.benchmark-official-stack-cache.outputs.cache-hit != 'true')
        run: |
          conda env update \
            --name "$CONDA_ENV_NAME" \
            --file .github/cycling-benchmark-linux-environment.yml \
            --prune

      - name: Detect the CPU allocation
        run: |
          # GNU nproc honors OMP_NUM_THREADS. Ignore that solver safeguard
          # while detecting the CPU allocation used for builds and OCP threads.
          available_cores="$(env -u OMP_NUM_THREADS -u OMP_THREAD_LIMIT nproc)"
          if [[ "$available_cores" -lt 1 ]]; then
            echo "No CPU was reported by nproc." >&2
            exit 1
          fi
          echo "BENCHMARK_THREADS=$available_cores" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$available_cores" >> "$GITHUB_ENV"
          lscpu
          grep '^Cpus_allowed_list' /proc/self/status || true

      - name: Cache the MadNLP runtime
        if: matrix.solver == 'madnlp'
        id: madnlp-cache
        uses: actions/cache@v6
        with:
          path: .cache/madnlp-mumps
          key: libmad-mumps-${{ inputs.runner_label }}-${{ runner.arch }}-julia-${{ env.JULIA_VERSION }}-${{ env.LIBMAD_COMMIT }}-${{ env.JULIAC_COMMIT }}

      - name: Verify the MadNLP host runtime
        if: matrix.solver == 'madnlp'
        run: bash .github/scripts/check_libmad_host_linux.sh

      - name: Install Julia for the MadNLP MUMPS runtime
        if: matrix.solver == 'madnlp' && steps.madnlp-cache.outputs.cache-hit != 'true'
        uses: julia-actions/install-juliaup@05d98a2ef433ca0723a8221e38c4723ea92b0c5f # v3.1.4
        with:
          channel: ${{ env.JULIA_VERSION }}

      - name: Build the MadNLP MUMPS runtime
        if: matrix.solver == 'madnlp' && steps.madnlp-cache.outputs.cache-hit != 'true'
        run: |
          bash .github/scripts/install_libmad_mumps_linux.sh \
            .benchmark-deps/libMad \
            .cache/madnlp-mumps \
            "$JULIAC_COMMIT"

      - name: Save the certified MadNLP runtime
        if: matrix.solver == 'madnlp' && steps.madnlp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/madnlp-mumps
          key: libmad-mumps-${{ inputs.runner_label }}-${{ runner.arch }}-julia-${{ env.JULIA_VERSION }}-${{ env.LIBMAD_COMMIT }}-${{ env.JULIAC_COMMIT }}

      - name: Configure the MadNLP runtime
        if: matrix.solver == 'madnlp'
        run: |
          test -f .cache/madnlp-mumps/lib/libMad.so
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/madnlp-mumps/lib:$GITHUB_WORKSPACE/.cache/madnlp-mumps/share/julia/lib:${LD_LIBRARY_PATH:-}" \
            >> "$GITHUB_ENV"
          echo "LIBMAD_BENCHMARK_COMMIT=$LIBMAD_COMMIT" >> "$GITHUB_ENV"

      - name: Install official CasADi with IPOPT
        if: matrix.solver != 'madnlp' && steps.benchmark-official-stack-cache.outputs.cache-hit != 'true'
        run: python -m pip install --no-deps "casadi==$CASADI_VERSION"

      - name: Build CasADi with the libMad ABI
        if: matrix.solver == 'madnlp' && steps.benchmark-madnlp-stack-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/install_casadi_madnlp_linux.sh .cache/madnlp-mumps

      - name: Install biorbd and Bioptim
        run: |
          if [[ "${{ matrix.solver }}" == "madnlp" ]]; then
            stack_cache_hit="${{ steps.benchmark-madnlp-stack-cache.outputs.cache-hit }}"
          else
            stack_cache_hit="${{ steps.benchmark-official-stack-cache.outputs.cache-hit }}"
          fi
          if [[ "$stack_cache_hit" != "true" ]]; then
            bash .github/scripts/install_biorbd_casadi_linux.sh
          fi
          python -m pip install --no-deps -e .benchmark-deps/bioptim

      - name: Download the validated common continuation seed
        uses: actions/download-artifact@v8
        with:
          name: cycling-assisted-common-seed-${{ github.run_id }}
          path: benchmark-seed

      - name: Verify the solver environment
        env:
          PYTHONPATH: ${{ github.workspace }}
          BENCHMARK_SOLVER: ${{ matrix.solver }}
          BENCHMARK_BACKEND: ${{ matrix.backend }}
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee solver-runtime-smoke.log
          import math
          import os
          from types import SimpleNamespace

          import casadi as cas
          import bioptim
          import biorbd_casadi as biorbd

          target = os.environ["BENCHMARK_SOLVER"]
          backend = os.environ["BENCHMARK_BACKEND"]
          print(f"CasADi {cas.__version__}")
          print(f"Bioptim {bioptim.__version__}")
          print(f"biorbd {biorbd.__version__}")
          compiler_flags = cas.CasadiMeta.compiler_flags()
          print(f"CasADi compiler flags: {compiler_flags}")
          assert "-DCASADI_WITH_THREAD" in compiler_flags
          for solver in dict.fromkeys(("ipopt", target)):
              available = cas.has_nlpsol(solver)
              print(f"{solver}: {available}")
              assert available, solver
          if target == "madnlp":
              assert hasattr(bioptim.Solver, "MADNLP")

          x = cas.SX.sym("x")
          smoke_target = target
          plugin_options = {"print_time": False}
          if smoke_target == "ipopt":
              plugin_options["ipopt"] = {"print_level": 0, "max_iter": 50}
          elif smoke_target == "madnlp":
              from cocofest.optimization.solver_backends import (
                  MADNLP_QUIET_PRINT_LEVEL,
                  configure_nlp_solver,
              )

              configured = configure_nlp_solver(
                  "madnlp",
                  max_iterations=50,
                  tolerance=1e-8,
                  madnlp_linear_solver=backend,
              )
              plugin_options = configured.as_dict(
                  SimpleNamespace(options_common=plugin_options)
              )
              assert plugin_options["madnlp"]["print_level"] == (
                  MADNLP_QUIET_PRINT_LEVEL
              )
              expected_linear_solver = {"mumps": "MumpsSolver"}[backend]
              print(
                  "MadNLP linear solver option: "
                  f"{plugin_options['madnlp']['linear_solver']}"
              )
              assert plugin_options["madnlp"]["linear_solver"] == expected_linear_solver
          smoke = cas.nlpsol(
              f"{smoke_target}_smoke",
              smoke_target,
              {"x": x, "f": (x - 1) ** 2, "g": x},
              plugin_options,
          )
          smoke_result = smoke(x0=0, lbg=1, ubg=1)
          smoke_x = float(smoke_result["x"])
          smoke_error = abs(smoke_x - 1.0)
          smoke_tolerance = 1e-6
          print(
              f"{target} minimal solution: x={smoke_x:.12g}, "
              f"error={smoke_error:.3e}, tolerance={smoke_tolerance:.1e}"
          )
          assert math.isfinite(smoke_x)
          assert smoke_error < smoke_tolerance
          print(f"{smoke_target} minimal solve: {smoke.stats()}")
          PY
          if grep -Fq \
            "libMAD WARNING: option linear_solver is of unknown type" \
            solver-runtime-smoke.log
          then
            echo "libMad rejected the requested linear_solver type." >&2
            exit 1
          fi
          python -m pytest -q \
            tests/shard1/test_solver_backends.py \
            tests/shard1/test_biorbd_backend_conversion.py \
            tests/shard1/test_plot_backend.py \
            tests/test_cycling_benchmark_summary.py \
            tests/test_solver_option_screen_summary.py \
            tests/shard1/test_reduced_cycling.py \
            tests/shard1/test_periodic_pulse_width.py::test_stimulation_snapshots_use_one_based_cycles_and_real_crank_phase \
            tests/shard1/test_periodic_pulse_width.py::test_common_primal_threshold_is_independent_of_nlp_solver_tolerance \
            tests/shard1/test_periodic_pulse_width.py::test_github_benchmark_compares_physical_threshold_not_solver_tolerance

      - name: Prepare sequential case directories
        run: |
          mkdir -p benchmark-results
          if ! [[ "$BENCHMARK_RHOS" =~ ^[1-9][0-9]*$ ]]; then
            echo "BENCHMARK_RHOS must be a strictly positive integer." >&2
            exit 1
          fi
          BENCHMARK_CYCLES=$((BENCHMARK_RHOS + BENCHMARK_CYCLES_PER_WINDOW - 1))
          echo "BENCHMARK_CYCLES=$BENCHMARK_CYCLES" >> "$GITHUB_ENV"

      - name: Run IPOPT full
        if: matrix.solver == 'ipopt'
        # Compiling the full 26-state collocation NLP repeatedly terminates the
        # hosted runner with SIGTERM 143 before any artifact can be checkpointed.
        # Keep the scientific full reference interpreted; the reduced case
        # below certifies persistent C evaluator reuse when requested.
        run: bash .github/scripts/run_cycling_benchmark_case.sh ipopt ipopt full mumps collocation benchmark-results "$BENCHMARK_CYCLES" false
      - name: Checkpoint IPOPT full
        if: ${{ always() && matrix.solver == 'ipopt' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cycling-fatigue-linux-ipopt-full-${{ github.run_id }}
          path: benchmark-results/ipopt-full/
          if-no-files-found: warn
          retention-days: 30

      - name: Run IPOPT reduced
        if: matrix.solver == 'ipopt'
        run: bash .github/scripts/run_cycling_benchmark_case.sh ipopt ipopt reduced mumps collocation benchmark-results "$BENCHMARK_CYCLES" "${{ inputs.compile_nlp_evaluators }}"
      - name: Checkpoint IPOPT reduced
        if: ${{ always() && matrix.solver == 'ipopt' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cycling-fatigue-linux-ipopt-reduced-${{ github.run_id }}
          path: benchmark-results/ipopt-reduced/
          if-no-files-found: warn
          retention-days: 30

      - name: Run MadNLP MUMPS full
        if: matrix.solver == 'madnlp'
        run: bash .github/scripts/run_cycling_benchmark_case.sh madnlp-mumps madnlp full mumps collocation benchmark-results "$BENCHMARK_CYCLES" false
      - name: Checkpoint MadNLP MUMPS full
        if: ${{ always() && matrix.solver == 'madnlp' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cycling-fatigue-linux-madnlp-mumps-full-${{ github.run_id }}
          path: benchmark-results/madnlp-mumps-full/
          if-no-files-found: warn
          retention-days: 30

      - name: Run MadNLP MUMPS reduced
        if: matrix.solver == 'madnlp'
        run: bash .github/scripts/run_cycling_benchmark_case.sh madnlp-mumps madnlp reduced mumps collocation benchmark-results "$BENCHMARK_CYCLES" false
      - name: Checkpoint MadNLP MUMPS reduced
        if: ${{ always() && matrix.solver == 'madnlp' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cycling-fatigue-linux-madnlp-mumps-reduced-${{ github.run_id }}
          path: benchmark-results/madnlp-mumps-reduced/
          if-no-files-found: warn
          retention-days: 30

      - name: Run FATROP collocation full
        if: matrix.solver == 'fatrop'
        run: bash .github/scripts/run_cycling_benchmark_case.sh fatrop-collocation fatrop full fatrop collocation benchmark-results "$BENCHMARK_CYCLES" "${{ inputs.compile_nlp_evaluators }}" sx none
      - name: Checkpoint FATROP collocation full
        if: ${{ always() && matrix.solver == 'fatrop' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cycling-fatigue-linux-fatrop-collocation-full-${{ github.run_id }}
          path: benchmark-results/fatrop-collocation-full/
          if-no-files-found: warn
          retention-days: 30

      - name: Run FATROP collocation reduced
        if: matrix.solver == 'fatrop'
        run: bash .github/scripts/run_cycling_benchmark_case.sh fatrop-collocation fatrop reduced fatrop collocation benchmark-results "$BENCHMARK_CYCLES" "${{ inputs.compile_nlp_evaluators }}" sx none
      - name: Checkpoint FATROP collocation reduced
        if: ${{ always() && matrix.solver == 'fatrop' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cycling-fatigue-linux-fatrop-collocation-reduced-${{ github.run_id }}
          path: benchmark-results/fatrop-collocation-reduced/
          if-no-files-found: warn
          retention-days: 30

      - name: Add every sequential result to the job summary
        if: always()
        shell: bash
        run: |
          while IFS= read -r result; do
            case_name="$(basename "$(dirname "$result")")"
            {
              echo "### ${case_name}"
              echo
              echo "| Field | Value |"
              echo "|---|---:|"
              jq -r '
                .results[0] |
                "| Success | \(.success) |",
                "| NLP-validated cycles | \(.nlp_validated_cycles) |",
                "| Physically validated cycles | \(.physically_validated_cycles) |",
                "| Validated cycles | \(.validated_cycles) |",
                "| Attempted RHO | \(.attempted_windows) |",
                "| End-to-end wall (s) | \(.end_to_end_wall_time_s) |",
                "| Preparation (s) | \(.initial_guess_preparation_time_s) |",
                "| Hot RHO median (s) | \(.hot_wall_time_median_s) |",
                "| Hot RHO P90 (s) | \(.hot_wall_time_p90_s) |",
                "| First failed RHO | \(.first_failed_rho) |",
                "| Minimum A/A_scale | \(.min_A_capacity_ratio) |",
                "| Stop | \(.stop.label) |"
              ' "$result"
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(find benchmark-results -name result.json -type f | sort)

      - name: Require every expected case without infrastructure errors
        if: always()
        shell: bash
        env:
          BENCHMARK_SOLVER: ${{ matrix.solver }}
          BENCHMARK_MODE: ${{ matrix.benchmark_mode }}
          COMPILE_NLP_EVALUATORS: ${{ inputs.compile_nlp_evaluators }}
        run: |
          if [[ "$BENCHMARK_SOLVER" == "madnlp" ]]; then
            COMPILE_NLP_EVALUATORS=false
          fi
          case "$BENCHMARK_SOLVER" in
            ipopt) expected=2 ;;
            madnlp) expected=2 ;;
            fatrop) expected=2 ;;
            *) echo "Unexpected benchmark solver: $BENCHMARK_SOLVER" >&2; exit 1 ;;
          esac
          mapfile -t results < <(find benchmark-results -name result.json -type f | sort)
          if [[ "${#results[@]}" -ne "$expected" ]]; then
            echo "${BENCHMARK_SOLVER}: expected $expected JSON files, found ${#results[@]}." >&2
            exit 1
          fi
          for result in "${results[@]}"; do
            if [[ "$BENCHMARK_SOLVER" == "fatrop" && "$result" == *"fatrop-collocation-full/"* ]]; then
              # The full constrained collocation Jacobian is outside the
              # structure currently accepted by CasADi's FATROP interface.
              # Keep this explicit negative control in the report without
              # classifying the already documented incompatibility as a CI
              # infrastructure failure.
              jq -e '
                .results[0] |
                (.attempted_windows == 0) and
                (.error | type == "string") and
                (.error | contains("specified structure of A does not correspond"))
              ' "$result"
              continue
            fi
            jq -e '
              (.configurations | to_entries | all(.value.use_sx == true)) and
              (
                .results[0] |
                (.attempted_windows > 0 and .error == null)
              )
            ' "$result"
            case_requires_compile="$COMPILE_NLP_EVALUATORS"
            if [[ "$BENCHMARK_SOLVER" == "ipopt" && "$result" == *"ipopt-full/"* ]]; then
              case_requires_compile=false
            fi
            if [[ "$case_requires_compile" == "true" ]]; then
              jq -e '
                .results[0] |
                (.compiled_nlp_reuse.enabled == true) and
                (.compiled_nlp_reuse.compiled_library_build_count == 1) and
                (.compiled_nlp_reuse.graph_rebuild_detected == false) and
                (.compiled_nlp_reuse.observed_solves == .attempted_windows) and
                (
                  (.attempted_windows <= 1) or
                  (
                    (.compiled_nlp_reuse.compiled_library_reused == true) and
                    (.compiled_nlp_reuse.runtime_bounds_changed == true) and
                    (.compiled_nlp_reuse.compiled_source_observed == true) and
                    (.compiled_nlp_reuse.compiled_source_observation_count == .attempted_windows) and
                    (.compiled_nlp_reuse.compiled_source_reused == true) and
                    (.compiled_nlp_reuse.unique_compiled_source_versions == 1)
                  )
                )
              ' "$result"
            fi
          done
  screen-report:
    name: Aggregate solver option screen
    if: ${{ always() && inputs.cycles == 'screen' }}
    needs: screen-options
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout Cocofest
        uses: actions/checkout@v6

      - name: Download every available option-screen artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: cycling-option-screen-*-${{ github.run_id }}
          path: benchmark-option-screen-all
          merge-multiple: true

      - name: Build the option comparison
        run: |
          mkdir -p benchmark-option-screen-all benchmark-option-report
          mapfile -t result_files < <(
            find benchmark-option-screen-all -name '*.json' -type f | sort
          )
          if [[ "${#result_files[@]}" -eq 0 ]]; then
            message="No option-screen JSON was produced; inspect the solver jobs."
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "$message" > benchmark-option-report/NO_RESULTS.txt
            exit 1
          fi
          python .github/scripts/summarize_solver_option_screen.py \
            --output-dir benchmark-option-report \
            --common-feasibility-threshold 1e-5 \
            "${result_files[@]}"
          cat benchmark-option-report/solver-option-screen.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the combined option report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cycling-option-screen-report-${{ github.run_id }}
          path: |
            benchmark-option-report/
            benchmark-option-screen-all/
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Aggregate Kevin benchmark
    if: ${{ always() && inputs.cycles != 'screen' && inputs.cycles != 'acados' }}
    needs: [benchmark, acados-smoke]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout Cocofest
        uses: actions/checkout@v6

      - name: Download every available solver artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: cycling-fatigue-linux-*-${{ github.run_id }}
          path: benchmark-results-all

      - name: Download the ACADOS baseline and option artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: cycling-acados-smoke-${{ github.run_id }}
          path: benchmark-acados-all
          merge-multiple: true

      - name: Build the comparison report
        run: |
          mkdir -p benchmark-results-all benchmark-report
          mapfile -t result_files < <(
            {
              find benchmark-results-all -name '*.json' -type f
              find benchmark-acados-all -path '*/sqp-irk-reference-*/result.json' -type f
            } | sort
          )
          if [[ "${#result_files[@]}" -eq 0 ]]; then
            message="No solver JSON was produced; inspect the prerequisite or matrix jobs."
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "$message" > benchmark-report/NO_RESULTS.txt
            exit 1
          fi
          python .github/scripts/summarize_cycling_benchmark.py \
            --output-dir benchmark-report \
            --expected-cases ipopt/full,madnlp-mumps/full,fatrop-collocation/full,acados/full,ipopt/reduced,madnlp-mumps/reduced,fatrop-collocation/reduced,acados/reduced \
            "${result_files[@]}"
          cat benchmark-report/benchmark-comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the combined Kevin report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cycling-fatigue-kevin-report-${{ github.run_id }}
          path: |
            benchmark-report/
            benchmark-results-all/
            benchmark-acados-all/
          if-no-files-found: warn
          retention-days: 30
